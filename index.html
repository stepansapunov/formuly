        <p>Правильный ответ закрашивает клетку, ошибка стирает две. Но закрасить все клетки за один вечер нельзя: память проверяется временем.</p>
        <ol class="steps">
          <li><b>1–2 клетки</b><span>сразу, в любой тренировке</span></li>
          <li><b>3-я клетка</b><span>на следующий день</span></li>
          <li><b>4-я клетка</b><span>ещё через 3 дня — формула выучена</span></li>
          <li><b>5-я клетка</b><span>ещё через 7 дней</span></li>
          <li><b>Дальше</b><span>проверка через 14 дней, потом раз в месяц</span></li>
        </ol>
        <p>Когда подходит срок, формула попадает в блок «Повторение» на главной. Если ответить на неё раньше срока, ответ засчитается как тренировка, но клетка не добавится.</p>
        <p>После ошибки формула сразу возвращается на повторение.</p>
        <p>Если формула ждёт повторения, а ты не заходишь, каждые 3 дня она теряет одну клетку. Совсем в ноль она не упадёт, одна клетка останется.</p>
        <p>Зачем так: формула, которую ты вспомнил через неделю, запомнилась надолго. А пять правильных ответов подряд за вечер через неделю забываются.</p>
        <p>Процент освоения показывает, сколько клеток закрашено из всех возможных.</p>
        <button class="btn btn-primary" data-ov-close>Понятно</button>
      </div>`;
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-ov-close]')) closeExpl(); });
    ov.querySelector('.icon-btn').focus({ preventScroll: true });
  }
  const afterActions = f => {
    const label = S.i + 1 < S.items.length ? 'Дальше' : 'Результат';
    return `<div class="actions"><button class="btn btn-ghost" data-expl>Пояснение</button><button class="btn btn-primary" data-next>${label}</button></div>`;
  };

  /* ---------- «Напиши формулу»: разбор, отображение, проверка ---------- */
  function tokenize(str) {
    const out = [];
    for (const m of str.matchAll(/\[([^\]]+)\]|sqrt\(|cos\(|sin\(|\^2|pi|\d+|[()+\-*\/]/g)) {
      const s = m[0];
      if (m[1] !== undefined) out.push({ t: 'atom', tex: m[1] });
      else if (s.endsWith('(') && s.length > 1) out.push({ t: 'fn', name: s.slice(0, -1) });
      else if (s === '^2') out.push({ t: 'sq' });
      else if (s === 'pi') out.push({ t: 'pi' });
      else if (/^\d+$/.test(s)) out.push({ t: 'num', v: +s });
      else if (s === '(') out.push({ t: 'lp' });
      else if (s === ')') out.push({ t: 'rp' });
      else out.push({ t: 'op', v: s });
    }
    return out;
  }
  function parseExpr(tokens) {
    let i = 0, hole = false;
    const peek = () => tokens[i];
    const isOp = (t, ...v) => t && t.t === 'op' && v.includes(t.v);
    const starts = t => t && ['atom', 'num', 'pi', 'lp', 'fn'].includes(t.t);
    const expr = () => { let n = term(); while (isOp(peek(), '+', '-')) { const op = tokens[i++].v; n = { k: 'bin', op, a: n, b: term() }; } return n; };
    const term = () => { let n = prod(); while (isOp(peek(), '*', '/')) { const op = tokens[i++].v; n = { k: 'bin', op, a: n, b: prod() }; } return n; };
    const prod = () => { let n = unary(); while (starts(peek())) n = { k: 'bin', op: 'imp', a: n, b: unary() }; return n; };
    const unary = () => { if (isOp(peek(), '-')) { i++; return { k: 'neg', a: unary() }; } return power(); };
    const power = () => { let n = primary(); while (peek() && peek().t === 'sq') { i++; n = { k: 'sq', a: n }; } return n; };
    const primary = () => {
      const t = peek();
      if (!t) { hole = true; return { k: 'hole' }; }
      if (t.t === 'atom') { i++; return { k: 'atom', tex: t.tex }; }
      if (t.t === 'num') { i++; return { k: 'num', v: t.v }; }
      if (t.t === 'pi') { i++; return { k: 'pi' }; }
      if (t.t === 'lp' || t.t === 'fn') {
        i++;
        let inner;
        if (!peek() || peek().t === 'rp') { hole = true; inner = { k: 'hole' }; } else inner = expr();
        if (peek() && peek().t === 'rp') i++;
        return t.t === 'lp' ? { k: 'grp', a: inner } : { k: 'fn', name: t.name, a: inner };
      }
      hole = true; return { k: 'hole' };
    };
    const tree = expr();
    return { tree, hole: hole || i < tokens.length };
  }
  const unGrp = n => n.k === 'grp' ? n.a : n;
  function toTex(n) {
    switch (n.k) {
      case 'atom': return `{${n.tex}}`;
      case 'num': return String(n.v);
      case 'pi': return '\\pi';
      case 'hole': return '\\boxed{\\phantom{0}}';
      case 'neg': return '-' + toTex(n.a);
      case 'grp': return `\\left(${toTex(n.a)}\\right)`;
      case 'sq': return n.a.k === 'atom' ? `${n.a.tex}^{2}` : (['num', 'pi', 'grp', 'hole'].includes(n.a.k) ? toTex(n.a) : `\\left(${toTex(n.a)}\\right)`) + '^{2}';
      case 'fn': return n.name === 'sqrt' ? `\\sqrt{${toTex(unGrp(n.a))}}` : `\\${n.name}\\left(${toTex(n.a)}\\right)`;
      case 'bin':
        if (n.op === '/') return `\\dfrac{${toTex(unGrp(n.a))}}{${toTex(unGrp(n.b))}}`;
        if (n.op === '*') return `${toTex(n.a)} \\cdot ${toTex(n.b)}`;
        if (n.op === 'imp') return `${toTex(n.a)}${n.a.k === 'num' && n.b.k === 'num' ? ' \\cdot ' : '\\,'}${toTex(n.b)}`;
        return `${toTex(n.a)} ${n.op} ${toTex(n.b)}`;
    }
    return '';
  }
  function evalExpr(n, env) {
    switch (n.k) {
      case 'atom': return env(n.tex);
      case 'num': return n.v;
      case 'pi': return Math.PI;
      case 'neg': return -evalExpr(n.a, env);
      case 'grp': return evalExpr(n.a, env);
      case 'sq': { const v = evalExpr(n.a, env); return v * v; }
      case 'fn': { const v = evalExpr(n.a, env); return n.name === 'sqrt' ? Math.sqrt(v) : n.name === 'cos' ? Math.cos(v) : Math.sin(v); }
      case 'bin': { const a = evalExpr(n.a, env), b = evalExpr(n.b, env); return n.op === '+' ? a + b : n.op === '-' ? a - b : n.op === '/' ? a / b : a * b; }
    }
    return NaN;
  }
  function sameExpr(a, b) {
    let ok = 0;
    for (let k = 0; k < 8; k++) {
      const vals = {};
      const env = tex => (vals[tex] ??= 0.6 + Math.random() * 2);
      const x = evalExpr(a, env), y = evalExpr(b, env);
      if (!isFinite(y)) continue;
      if (!isFinite(x) || Math.abs(x - y) > 1e-7 * Math.max(1, Math.abs(x), Math.abs(y))) return false;
      ok++;
    }
    return ok >= 3;
  }
  const atomsOf = f => f.e ? [...new Set(f.e.tokens.filter(t => t.t === 'atom').map(t => t.tex))] : [];

  function qWrite(f) {
    const answer = parseExpr(f.e.tokens).tree;
    const mine = atomsOf(f);
    const pool = [...new Set(f.topic.items.filter(x => x !== f).flatMap(atomsOf))].filter(a => !mine.includes(a));
    const atoms = shuffle([...mine, ...shuffle(pool).slice(0, 3)]);
    const fns = [...new Set(f.e.tokens.filter(t => t.t === 'fn' && t.name !== 'sqrt').map(t => t.name))];
    if (fns.includes('cos')) fns.push('sin');
    const KEYS = [
      ...atoms.map(a => ({ tok: { t: 'atom', tex: a }, label: tex(a), cls: 'var' })),
      { tok: { t: 'op', v: '+' }, label: '+' }, { tok: { t: 'op', v: '-' }, label: '−' }, { tok: { t: 'op', v: '*' }, label: tex('\\cdot') },
      { tok: { t: 'op', v: '/' }, label: tex('\\frac{a}{b}') }, { tok: { t: 'sq' }, label: tex('\\square^2') },
      { tok: { t: 'lp' }, label: '(' }, { tok: { t: 'rp' }, label: ')', id: 'rp' }, { tok: { t: 'fn', name: 'sqrt' }, label: tex('\\sqrt{\\square}') },
      { tok: { t: 'num', v: 1 }, label: '1' }, { tok: { t: 'num', v: 2 }, label: '2' }, { tok: { t: 'pi' }, label: tex('\\pi') },
      ...fns.map(n => ({ tok: { t: 'fn', name: n }, label: tex(`\\${n}`) }))
    ];
    let toks = [], verdict = null;
    const open = () => toks.reduce((d, t) => d + (t.t === 'lp' || t.t === 'fn' ? 1 : t.t === 'rp' ? -1 : 0), 0);
    const render = () => {
      const p = parseExpr(toks), done = verdict !== null, ok = verdict === true;
      paint(`${top()}
        <article class="qcard" style="min-height:0">
          <span class="eyebrow">${esc(f.topic.title)} · напиши формулу</span>
          <div class="ask">${esc(f.n)}</div>
          <div class="formula write-line">${tex(`${f.e.lhs} = ${toks.length ? toTex(p.tree) : '\\boxed{\\phantom{00}}'}`)}</div>
          ${!done && open() > 0 ? '<p class="hint">Скобку и корень закрывает кнопка «)»</p>' : ''}
        </article>
        ${done ? `
          <div class="verdict-line"><span class="verdict ${ok ? 'ok' : 'bad'}">${ok ? 'Верно' : 'Ошибка. Правильно так:'}</span>${ok ? earlyNote() : `<span class="tex-inline">${tex(f.f)}</span>`}</div>
          ${afterActions(f)}` : `
          <div class="kb">
            ${KEYS.map((k, i) => `<button class="key ${k.cls || ''}" data-k="${i}" ${k.id === 'rp' && !open() ? 'disabled' : ''}>${k.label}</button>`).join('')}
            <button class="key del" data-del aria-label="Стереть">⌫</button>
          </div>
          <div class="actions">
            <button class="btn btn-ghost" data-giveup>Не помню</button>
            <button class="btn btn-primary" data-check ${toks.length && !p.hole ? '' : 'disabled'}>Проверить</button>
          </div>`}
      `, e => {
        if (done) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } }
        else if (e.key === 'Backspace') { e.preventDefault(); del(); }
        else if (e.key === 'Enter') check();
        if (e.key === 'Escape') S.results.length ? result() : S.back();
      });
      wireTop();
      $app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { haptic('tap'); toks.push(KEYS[+b.dataset.k].tok); render(); });
      const d = $app.querySelector('[data-del]'); if (d) d.onclick = del;
      const c = $app.querySelector('[data-check]'); if (c) c.onclick = check;
      const g = $app.querySelector('[data-giveup]'); if (g) g.onclick = () => finish(false);
      const n = $app.querySelector('[data-next]'); if (n) { n.onclick = next; n.focus({ preventScroll: true }); }
      const xb = $app.querySelector('[data-expl]'); if (xb) xb.onclick = () => openExpl(f);
    };
    const del = () => { if (toks.length) { toks.pop(); render(); } };
    const finish = ok => { if (verdict !== null) return; verdict = ok; record(f, ok); render(); };
    const check = () => { const p = parseExpr(toks); if (!toks.length || p.hole) return; finish(sameExpr(p.tree, answer)); };
    render();
  }

  /* ---------- результат ---------- */
  function result() {
    const r = S.results, ok = r.filter(x => x.ok).length, miss = r.filter(x => !x.ok);
    const note = !r.length ? '' : ok === r.length ? 'Чисто! Эти формулы будут попадаться реже.' : ok / r.length >= .7 ? 'Хорошо. Ошибки ниже — повтори их ещё раз.' : 'Нормально для начала. Ошибки будут попадаться чаще, пока не запомнишь.';
    paint(`
      <div class="bar"><span class="title">${esc(S.label)}</span></div>
      <section class="result">
        <span class="eyebrow">Результат</span>
        <div class="score num">${ok}<small> / ${r.length}</small></div>
        <p class="muted" style="margin:0; max-width:34ch">${note}</p>
        ${(() => { const d = dueList().length; if (d) return `<p class="muted" style="margin:0">На повторение ещё ${plural(d, 'ждёт', 'ждут', 'ждут')} ${d} ${plural(d, 'формула', 'формулы', 'формул')}.</p>`; const tm = ALL.filter(f => lvl(f.id) >= 1 && whenLabel(dueAt(f.id)) === 'завтра').length; return tm ? `<p class="muted" style="margin:0">Завтра на повторение: ${tm} ${plural(tm, 'формула', 'формулы', 'формул')}.</p>` : ''; })()}
      </section>
      ${miss.length ? `
        <section style="display:flex;flex-direction:column;gap:10px">
          <div class="section-head"><h2>Где ошибся</h2></div>
          <div class="missed">${miss.map(({ f }) => `<div class="row"><span class="muted" style="font-size:14px">${esc(f.n)}</span><span class="tex-wrap">${tex(f.f)}</span></div>`).join('')}</div>
        </section>` : ''}
      <div class="actions">
        <button class="btn btn-ghost" data-done>Готово</button>
        <button class="btn btn-primary" data-again>Ещё раунд</button>
      </div>
    `, e => { if (e.key === 'Enter') again(); else if (e.key === 'Escape') S.back(); });
    const again = () => start(S);
    $app.querySelector('[data-again]').onclick = again;
    $app.querySelector('[data-done]').onclick = () => S.back();
    setBack(() => S.back());
  }

  /* ---------- приветствие при первом запуске ---------- */
  let onboarded = false;
  try { onboarded = localStorage.getItem('formuly.onb.v1') === '1'; } catch (e) {}
  const WELCOME = [
    { t: 'Формулы для ЕГЭ', b: `<p>Здесь ты учишь формулы по физике, которые мы проходим на курсе. Одна тренировка — 10 вопросов и 3–5 минут.</p><p>Режимы разные: найти формулу, узнать её, собрать из кусочков или набрать самому. Если ошибся, открой «Пояснение»: там разобрано, откуда формула берётся.</p>` },
    { t: 'Клетки', b: `<p>У каждой формулы 5 клеток. Правильный ответ закрашивает клетку, ошибка стирает две.</p><ul class="help-list"><li>${'CELLS0'}<span>ещё не встречалась</span></li><li>${'CELLS2'}<span>начата</span></li><li>${'CELLS4'}<span>выучена</span></li></ul>` },
    { t: 'Заходи каждый день', b: `<p>Выученные формулы возвращаются на повторение: через день, потом через 3, 7 и 14 дней. Так они остаются в голове до экзамена.</p><p>Если формула ждёт повторения, а ты 3 дня не заходишь, она теряет клетку. Хватает 5 минут в день.</p>` }
  ];
  function openWelcome() {
    if (ov) return;
    let step = 0;
    ov = document.createElement('div');
    ov.className = 'ov';
    const cellsDemo = n => `<span class="cells ${n >= 4 ? 'l5' : ''}">${Array.from({ length: MAX }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
    const draw = () => {
      const w = WELCOME[step], last = step === WELCOME.length - 1;
      ov.innerHTML = `
        <div class="ov-card welcome" role="dialog" aria-modal="true" aria-label="${w.t}">
          <span class="eyebrow">${step + 1} из ${WELCOME.length}</span>
          <h2>${w.t}</h2>
          ${w.b.replace('CELLS0', cellsDemo(0)).replace('CELLS2', cellsDemo(2)).replace('CELLS4', cellsDemo(4))}
          <div class="dots">${WELCOME.map((_, i) => `<i class="${i === step ? 'on' : ''}"></i>`).join('')}</div>
          <button class="btn btn-primary" data-wnext>${last ? 'Начать' : 'Дальше'}</button>
        </div>`;
      ov.querySelector('[data-wnext]').onclick = () => {
        if (!last) { step++; draw(); return; }
        onboarded = true;
        try { localStorage.setItem('formuly.onb.v1', '1'); } catch (e) {}
        cloudQueue('o', 1);
        closeExpl();
      };
    };
    draw();
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
  }

  /* ---------- запуск ---------- */
  function boot() {
    cloudLoad(['p', 's', 'd', 'o'], data => {
      const has = o => o && typeof o === 'object' && Object.keys(o).length;
      if (has(data.p)) { progress = data.p; seen = has(data.s) ? data.s : seen; sched = has(data.d) ? data.d : sched; try { localStorage.setItem(KEY, JSON.stringify(progress)); localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); localStorage.setItem(SCHED_KEY, JSON.stringify(sched)); } catch (e) {} }
      else if (Object.keys(progress).length) { cloudQueue('p', progress); cloudQueue('s', seen); cloudQueue('d', sched); }
      if (data.o) onboarded = true;
      home();
      syncTheme();
      if (inTg) { try { tg.onEvent('themeChanged', () => { syncTheme(); }); } catch (e) {} }
      if (!onboarded) openWelcome();
    });
  }
  boot();
  const fallback = setTimeout(() => { if (!mathReady) typeset(); }, 6000);
  window.__onMath = () => { try { document.head.appendChild(MathJax.svgStylesheet()); } catch (e) {} mathReady = true; clearTimeout(fallback); cache.clear(); typeset(); };
  if (window.__mjReady) window.__onMath();
  return {};
})();
</script>

</body>
