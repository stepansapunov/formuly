<script type="text/plain" id="expl">
@ kin-1
p: При равномерном прямолинейном движении тело за любые равные промежутки времени совершает одинаковые перемещения. Скорость при этом постоянна.
p: Направим ось OX вдоль движения. Проекция перемещения равна разности конечной и начальной координаты: $s_x = x - x_0$.
fig: uniformAnim
p: С другой стороны, при равномерном движении $s_x = v_x t$. Приравняем и выразим координату: $x = x_0 + v_x t$.
p: Если тело движется против оси OX, то $v_x < 0$, и координата с течением времени уменьшается. Формула при этом та же.

@ kin-2
p: При равноускоренном движении скорость тела за любые равные промежутки времени меняется на одну и ту же величину. Ускорение показывает, на сколько меняется скорость за одну секунду.
p: Буквой $\Delta$ обозначают изменение величины. Если за время $\Delta t$ скорость изменилась на $\Delta\vec v$, то ускорение равно $\vec a = \dfrac{\Delta\vec v}{\Delta t}$.
fig: slope
p: На графике зависимости скорости от времени ускорение равно тангенсу угла наклона прямой. Если скорость уменьшается, график идёт вниз, и проекция ускорения отрицательная.
p: Размерность ускорения: $\dfrac{\text{м/с}}{\text{с}} = \text{м/с}^2$.

@ kin-3
p: Запишем формулу ускорения: $a_x = \dfrac{v_x - v_{0x}}{t}$.
p: Выведем из неё скорость. Умножим обе части на $t$ и перенесём $v_{0x}$: $v_x = v_{0x} + a_x t$.
fig: vel
p: Получается, что при равноускоренном движении скорость зависит от времени линейно, и её график является прямой.
fig: velAnim
p: При торможении ускорение направлено против скорости, проекция $a_x$ отрицательная, и скорость уменьшается.

@ kin-4
p: Как и при равномерном движении, площадь под графиком зависимости скорости от времени равна перемещению.
fig: areaAnim
p: Фигуру под графиком разобьём на прямоугольник и треугольник. Площадь прямоугольника $v_{0x} t$, площадь треугольника $\dfrac{1}{2}\cdot t\cdot a_x t = \dfrac{a_x t^2}{2}$.
p: Сложим их и получим перемещение: $s_x = v_{0x} t + \dfrac{a_x t^2}{2}$.
p: Так как $x = x_0 + s_x$, координата тела равна $x = x_0 + v_{0x} t + \dfrac{a_x t^2}{2}$.
p: Зависимость координаты от времени квадратичная, её график называется параболой. Если ветви направлены вверх, проекция ускорения положительная, если вниз, то отрицательная.
p: Формула есть в кодификаторе, на экзамене её можно использовать без вывода.

@ kin-5
p: Выведем формулу перемещения, в которой нет времени. Для этого возьмём две формулы: $s_x = \dfrac{v_{0x} + v_x}{2}\,t$ и $v_x = v_{0x} + a_x t$.
p: Из второй формулы выразим время: $t = \dfrac{v_x - v_{0x}}{a_x}$.
p: Подставим его в первую формулу и выполним преобразования: $s_x = \dfrac{(v_x + v_{0x})(v_x - v_{0x})}{2a_x} = \dfrac{v_x^2 - v_{0x}^2}{2a_x}$.
fig: avg
p: Формулой удобно пользоваться, когда время в задаче не дано и не спрашивается. Она есть в кодификаторе, поэтому её можно применять без вывода.

@ kin-6
p: Площадь под графиком скорости равна перемещению. При равноускоренном движении фигура под графиком является трапецией.
fig: avg
p: Найдём её площадь: полусумма оснований, умноженная на высоту. Основания трапеции равны $v_{0x}$ и $v_x$, высота равна $t$.
p: Получаем формулу перемещения: $s_x = \dfrac{v_{0x} + v_x}{2}\,t$.
p: Выражение $\dfrac{v_{0x} + v_x}{2}$ равно средней скорости, но только при равноускоренном движении. Формула есть в кодификаторе, её можно использовать без вывода.

@ kin-7
p: Тело падает с высоты $h$ без начальной скорости. Введём ось OY вертикально вверх, начало отсчёта поместим на уровень земли.
p: Тогда $y_0 = h$ и $v_{0y} = 0$. Ускорение свободного падения направлено вниз, против оси, поэтому его проекция равна $-g$. Уравнение координаты: $y = h - \dfrac{g t^2}{2}$.
fig: fallAnim
p: В момент удара о землю координата $y = 0$: $0 = h - \dfrac{g t^2}{2}$. Выразим время падения: $t = \sqrt{\dfrac{2h}{g}}$.
p: Например, с высоты 20 м тело падает за $\sqrt{2\cdot 20 / 10} = 2$ с. На ЕГЭ берут $g = 10$ м/с².
p: Скорость перед ударом найдём из $v_y = -g t$. По модулю $v = g t = \sqrt{2gh}$. Не путайте её со временем падения, в тестах эти формулы часто стоят рядом.
p: Этой формулы нет в кодификаторе, поэтому на экзамене её нужно выводить.

@ kin-8
p: Скорость тела зависит от системы отсчёта. Рассмотрим лодку, которая переплывает реку.
p: Относительно воды лодка движется со скоростью $\vec v_{\text{отн}}$, а сама вода движется относительно берега со скоростью $\vec v_{\text{пер}}$.
fig: boatAnim
p: Скорость лодки относительно берега равна их векторной сумме: $\vec v = \vec v_{\text{отн}} + \vec v_{\text{пер}}$. Складываем по правилу треугольника: совмещаем конец первого вектора с началом второго.
p: Если лодка плывёт по течению, модули скоростей складываются, против течения вычитаются. Если векторы перпендикулярны, модуль находим по теореме Пифагора: $v = \sqrt{v_{\text{отн}}^2 + v_{\text{пер}}^2}$.
p: Так же находится скорость сближения двух тел. При движении навстречу скорости складываются, при движении в одну сторону из большей скорости вычитается меньшая.

@ kin-9
p: Период обращения $T$ равен времени одного полного оборота. Частота обращения $\nu$ равна количеству полных оборотов за единицу времени.
p: Если тело совершило $N$ оборотов за время $t$, то $T = \dfrac{t}{N}$ и $\nu = \dfrac{N}{t}$.
fig: freq
p: Из этих определений следует, что частота обратно пропорциональна периоду: $T = \dfrac{1}{\nu}$.
p: Например, человек сделал 10 оборотов вокруг своей оси за 13,2 с. Тогда $T = 13{,}2 / 10 = 1{,}32$ с, а $\nu = 10 / 13{,}2 \approx 0{,}76$ Гц.
p: Частоту измеряют в герцах: 1 Гц = 1 с⁻¹. Отдельное название нужно, чтобы не путать частоту с угловой скоростью.

@ kin-10
p: Чтобы понять, как быстро поворачивается тело, вводят угловую скорость. Она равна углу поворота, делённому на время: $\omega = \dfrac{\varphi}{t}$, размерность рад/с.
fig: angAnim
p: При полном обороте тело возвращается в ту же точку и поворачивается на $360^\circ$, то есть на $2\pi$ радиан. Время одного оборота равно периоду $T$.
p: Подставим в определение: $\omega = \dfrac{2\pi}{T}$. Так как $\dfrac{1}{T} = \nu$, можно записать ещё $\omega = 2\pi\nu$.
p: Радиан является безразмерной величиной, поэтому угловую скорость можно записывать и в с⁻¹.

@ kin-11
p: Пусть точка движется по окружности радиуса $R$. Распишем модуль скорости как отношение пройденного пути ко времени.
p: За один оборот точка проходит длину окружности $2\pi R$ за время $T$, поэтому $v = \dfrac{2\pi R}{T}$.
fig: lin
p: Так как $\dfrac{2\pi}{T} = \omega$, получаем $v = \omega R$.
p: У всех точек вращающегося диска угловая скорость одинаковая. Линейная скорость тем больше, чем дальше точка от центра.
fig: diskAnim
p: Если две шестерёнки соединены цепью, как у велосипеда, одинаковыми будут линейные скорости, а угловые скорости будут разными.

@ kin-12
p: При равномерном движении по окружности модуль скорости не меняется, а направление меняется постоянно. Скорость всегда направлена по касательной к окружности.
fig: centAnim
p: Направление скорости меняет центростремительное ускорение. Оно направлено к центру окружности.
p: Его модуль равен $a_{\text{ц}} = \dfrac{v^2}{R}$. Подставим $v = \omega R$ и получим вторую форму: $a_{\text{ц}} = \omega^2 R$.
p: Если модуль скорости тоже меняется, появляется ещё тангенциальное ускорение, направленное вдоль скорости. Полное ускорение находят по теореме Пифагора: $a = \sqrt{a_{\text{ц}}^2 + a_\tau^2}$.
p: Формулу легко проверить по размерности: $\dfrac{(\text{м/с})^2}{\text{м}} = \text{м/с}^2$.

@ dyn-1
p: Второй закон Ньютона: в инерциальной системе отсчёта ускорение тела прямо пропорционально и сонаправлено силе, которая его вызывает, и обратно пропорционально массе тела.
p: Если на тело действует сразу несколько сил, применяем принцип суперпозиции: заменяем их одной результирующей силой, равной векторной сумме всех сил.
fig: newton2
p: Для бруска на рисунке: $m\vec a = \vec F + \vec F_{\text{тр}} + m\vec g + \vec N$. Дальше закон расписывают в проекциях на оси. Например, на ось OX: $ma = F - F_{\text{тр}}$.
p: Если сумма сил равна нулю, ускорения нет, и тело покоится или движется равномерно прямолинейно. Это первый закон Ньютона.
p: Частая ошибка в тестах: $m\vec v$ вместо $m\vec a$. Сила связана с ускорением, а не со скоростью.

@ dyn-2
p: Третий закон Ньютона: силы, с которыми взаимодействуют два тела, равны по модулю, противоположны по направлению, имеют одинаковую природу и лежат на одной прямой.
fig: newton3
p: Рассмотрим два шара, которые опираются друг на друга. Левый шар действует на правый с силой $\vec F_{12}$, правый на левый с силой $\vec F_{21}$. Эти силы равны по модулю и направлены в разные стороны: $\vec F_{12} = -\vec F_{21}$.
p: Силы приложены к разным телам, поэтому они не компенсируют друг друга.
p: Из третьего закона следует, что вес тела по модулю равен силе реакции опоры: тело давит на опору с той же силой, с какой опора давит на тело.

@ dyn-3
p: Два тела массами $m_1$ и $m_2$, центры масс которых находятся на расстоянии $R$, притягиваются друг к другу с силой $F = G\dfrac{m_1 m_2}{R^2}$.
fig: grav
p: Где $G$ – гравитационная постоянная. Она одинакова на любых планетах и во всех галактиках. В справочных материалах ЕГЭ $G = 6{,}7\cdot 10^{-11}$ Н·м²/кг².
p: По третьему закону Ньютона тела притягивают друг друга с одинаковыми по модулю силами, даже если одно тело намного массивнее другого.
p: Сила обратно пропорциональна квадрату расстояния: если расстояние увеличить в 2 раза, сила уменьшится в 4 раза.

@ dyn-4
p: На поверхности планеты сила тяжести равна силе тяготения: $mg = G\dfrac{mM}{R^2}$. Сократим массу тела и получим $g = G\dfrac{M}{R^2}$.
fig: height
p: Если тело находится на высоте $h$ над поверхностью, расстояние до центра планеты равно уже не $R$, а $R + h$. Поэтому $g = G\dfrac{M}{(R + h)^2}$.
p: Частая ошибка: забыть скобку и написать $R^2 + h$. В квадрат возводится всё расстояние до центра планеты.
p: Этой формулы нет в кодификаторе, поэтому на ЕГЭ её нужно выводить.

@ dyn-5
p: Первая космическая скорость – скорость, с которой должно двигаться тело, чтобы стать искусственным спутником планеты.
fig: orbitAnim
p: Спутник движется по окружности, и на него действует только сила тяготения. Она и сообщает ему центростремительное ускорение. Запишем второй закон Ньютона: $G\dfrac{mM}{R^2} = m\dfrac{v^2}{R}$.
p: Сократим массу спутника и один радиус, получим $v_1 = \sqrt{\dfrac{GM}{R}}$. Так как $g = G\dfrac{M}{R^2}$, можно записать и так: $v_1 = \sqrt{gR}$.
p: Для Земли первая космическая скорость равна 7,9 км/с. Вторая космическая, с которой тело покидает Землю, равна 11,2 км/с.
p: Формул космических скоростей нет в кодификаторе, на ЕГЭ их нужно выводить.

@ dyn-6
p: Сила упругости возникает при деформации упругого тела. Её находят по закону Гука: $F_{\text{упр}\,x} = -kx$.
fig: spring
p: Где $k$ – жёсткость пружины, Н/м, а $x$ – удлинение пружины, м.
p: Минус показывает направление: сила упругости всегда направлена против удлинения и пытается вернуть пружину в недеформированное состояние. По модулю $F_{\text{упр}} = k\,|\Delta l|$.
p: Не путайте с энергией пружины $\dfrac{kx^2}{2}$: там удлинение в квадрате и двойка в знаменателе.

@ dyn-7
p: Сила трения возникает при соприкосновении двух тел и препятствует их относительному движению.
p: Проведём эксперимент: будем тянуть брусок динамометром, постепенно увеличивая силу. Пока брусок покоится, на него действует сила трения покоя, и она равна приложенной силе.
fig: frictionAnim
p: Когда брусок начинает скользить, действует сила трения скольжения: $F_{\text{тр}} = \mu N$. Где $\mu$ – коэффициент трения, безразмерная величина, $N$ – сила реакции опоры.
p: В рамках ЕГЭ максимальную силу трения покоя принимают равной силе трения скольжения, поэтому $F_{\text{тр.пок}} \le \mu N$.
p: Обратите внимание: в формуле стоит $N$, а не $mg$. Они равны, только если тело лежит на горизонтальной поверхности и других вертикальных сил нет.

@ dyn-8
p: Вес тела – сила, с которой тело действует на опору или подвес. По третьему закону Ньютона вес по модулю равен силе реакции опоры: $P = N$.
p: Пусть тело стоит на полу лифта, ускорение которого направлено вверх. Направим ось OY вверх и запишем второй закон Ньютона: $ma = N - mg$.
fig: liftUpAnim
p: Отсюда $N = m(g + a)$, значит и $P = m(g + a)$. Вес больше силы тяжести, поэтому в таком лифте человека прижимает к полу.

@ stat-1
p: Одна и та же сила может повернуть тело сильнее или слабее, смотря где и как её приложить. Поэтому для вращения вводят момент силы: $M = Fl$, размерность Н·м.
fig: arm
p: Где $l$ – плечо силы, кратчайшее расстояние от оси вращения до линии действия силы. Если сила направлена под углом, плечо не равно расстоянию до точки приложения.
p: Чтобы найти плечо, продлеваем линию действия силы (пунктир на рисунке) и опускаем на неё перпендикуляр из оси. Длина этого перпендикуляра и есть плечо.
p: Если линия действия силы проходит через ось, плечо равно нулю, и сила тело не поворачивает. Поэтому дверь не открыть, если толкать её в сторону петель.

@ stat-2
p: Рычаг находится в равновесии, если моменты сил, которые вращают его в разные стороны, равны: $M_1 = M_2$.
fig: lever
p: Распишем моменты через силы и плечи: $F_1 l_1 = F_2 l_2$.
p: Выигрыш в силе получается за счёт длинного плеча: во сколько раз плечо больше, во столько раз меньше нужна сила. На рисунке $l_2 = 2l_1$, поэтому $F_2 = \dfrac{F_1}{2}$.
p: Если сил больше двух, сумма моментов, вращающих по часовой стрелке, равна сумме моментов против часовой. Для равновесия тела также должна быть равна нулю сумма всех сил.

@ stat-3
p: Давление показывает, какая сила приходится на единицу площади поверхности: $p = \dfrac{F}{S}$. Размерность давления – паскаль: 1 Па = 1 Н/м².
fig: pressure
p: Один и тот же брусок давит на стол с одинаковой силой, как его ни положи. Но если поставить его на меньшую грань, площадь опоры уменьшится, и давление вырастет.
p: Поэтому острый нож режет лучше тупого, а на лыжах человек не проваливается в снег. По той же причине по тонкому льду не ходят, а ползут: стоя человек давит на лёд маленькой площадью ступней и может провалиться, а лёжа опирается на большую площадь, давление падает, и лёд выдерживает.
p: Частая ошибка – умножить силу на площадь. Проверить можно по смыслу: чем меньше площадь, тем больше давление, значит площадь стоит в знаменателе.

@ stat-4
p: Рассмотрим столб жидкости высотой $h$ с площадью основания $S$. Его масса $m = \rho V = \rho S h$, и он давит на дно с силой $mg = \rho S h g$.
fig: column
p: Разделим силу на площадь: $p = \dfrac{\rho S h g}{S} = \rho g h$.
p: Давление жидкости зависит только от глубины и плотности, но не от формы сосуда. На одной глубине давление одинаковое во всех направлениях.

@ stat-5
p: На тело, погружённое в жидкость, действует выталкивающая сила. Она возникает, потому что снизу, на большей глубине, давление больше, чем сверху.
fig: archimedes
p: Сила Архимеда равна весу жидкости в объёме погружённой части тела: $F_{\text{А}} = \rho_{\text{ж}}\, g\, V_{\text{погр}}$.
p: В формулу входит плотность жидкости, а не тела. Плотность тела нужна, только чтобы найти его массу и сравнить силу тяжести с силой Архимеда.
p: Если $F_{\text{А}} > mg$, тело всплывает, если меньше, то тонет. Если $F_{\text{А}} = mg$, тело плавает.
fig: archCases
p: Когда плотность тела равна плотности жидкости, силы равны уже при полном погружении. Такое тело плавает внутри жидкости на любой глубине: где его отпустишь, там оно и останется.
p: Когда плотность тела меньше плотности жидкости, оно всплывает и плавает на поверхности, погрузившись ровно настолько, чтобы $F_{\text{А}} = mg$. В силу Архимеда тогда входит объём только погружённой части: $\rho_{\text{ж}}\, g\, V_{\text{погр}} = mg$, а $m$ – масса всего тела.

@ stat-6
p: По закону Паскаля давление, которое создают на жидкость, передаётся в любую её точку без изменений.
fig: press
p: Малый поршень создаёт давление $p = \dfrac{F_1}{S_1}$. Такое же давление действует на большой поршень: $p = \dfrac{F_2}{S_2}$. Приравниваем: $\dfrac{F_1}{S_1} = \dfrac{F_2}{S_2}$.
p: Выигрыш в силе равен отношению площадей: $\dfrac{F_2}{F_1} = \dfrac{S_2}{S_1}$. Если площадь большого поршня в 100 раз больше, то и сила будет в 100 раз больше.
p: Выигрыша в работе при этом нет: малый поршень приходится двигать на большее расстояние.

@ cons-1
p: Импульс тела – векторная величина, равная произведению массы тела на его скорость: $\vec p = m\vec v$, размерность кг·м/с.
fig: momentum
p: Вектор импульса направлен так же, как скорость. В задачах импульс расписывают в проекциях на оси, и знак проекции зависит от направления движения.
p: Импульс показывает, насколько трудно остановить тело. У грузовика и мяча с одинаковой скоростью импульсы разные, потому что разные массы.

@ cons-2
p: Запишем второй закон Ньютона, выразив ускорение через изменение скорости: $\vec F = m\dfrac{\Delta\vec v}{\Delta t}$.
p: Умножим обе части на $\Delta t$: $\vec F\,\Delta t = m\,\Delta\vec v = \Delta\vec p$.
fig: impulse
p: Произведение $\vec F\,\Delta t$ называют импульсом силы. Изменение импульса тела равно импульсу силы, которая на него подействовала.
p: Поэтому удар смягчают, увеличивая время: при том же изменении импульса сила получается меньше. Так работают подушки безопасности. По той же причине человек, приземляясь после прыжка, сгибает ноги в коленях: торможение длится дольше, и удар по ногам получается слабее.
fig: impulseAnim

@ cons-3
p: Рассмотрим замкнутую систему тел: внешние силы на неё не действуют или скомпенсированы, и тела взаимодействуют только друг с другом.
fig: collisionAnim
p: По третьему закону Ньютона при столкновении тела действуют друг на друга с равными и противоположными силами одно и то же время. Значит, изменения их импульсов равны по модулю и противоположны по направлению.
p: Поэтому суммарный импульс системы не меняется: $m_1\vec v_1 + m_2\vec v_2 = m_1\vec v_1\,' + m_2\vec v_2\,'$.
p: В задачах закон записывают в проекциях, и скорость, направленная против оси, входит со знаком минус. Если после удара тела движутся вместе, справа будет $(m_1 + m_2)\,\vec v\,'$.

@ cons-4
p: Механическая работа совершается, когда сила перемещает тело: $A = Fs\cos\alpha$, где $\alpha$ – угол между силой и перемещением. Размерность работы – джоуль.
fig: work
p: Работу совершает только составляющая силы вдоль перемещения, $F\cos\alpha$.
p: Отсюда следствие: если сила перпендикулярна перемещению, то $\alpha = 90^\circ$, $\cos 90^\circ = 0$, и работа равна нулю. Например, сила тяжести не совершает работы при движении по горизонтали, а сила реакции опоры – при скольжении по поверхности.
p: Если угол тупой, $\cos\alpha < 0$, и работа отрицательная. Так, работа силы трения скольжения всегда отрицательная.

@ cons-5
p: Мощность показывает, как быстро совершается работа: $N = \dfrac{A}{t}$. Размерность мощности – ватт: 1 Вт = 1 Дж/с.
p: Два подъёмных крана поднимают одинаковые грузы на одну высоту и совершают одинаковую работу. Мощнее тот кран, который сделает это быстрее.
p: Отсюда же находят работу при известной мощности: $A = Nt$. На этом основан киловатт-час, по которому платят за электричество.
p: Частая ошибка – умножить работу на время. Проверка по смыслу: чем меньше время при той же работе, тем больше мощность.

@ cons-6
p: Возьмём формулу мощности $N = \dfrac{A}{t}$ и распишем работу силы, направленной вдоль перемещения: $A = Fs$.
p: Получаем $N = \dfrac{Fs}{t}$, а $\dfrac{s}{t}$ равно скорости. Поэтому $N = Fv$.
fig: powerFv
p: Формула удобна для машин и двигателей. При постоянной мощности двигателя сила тяги тем больше, чем меньше скорость. Поэтому в гору едут на пониженной передаче.
p: Если сила направлена под углом к скорости, $N = Fv\cos\alpha$.

@ cons-7
p: Найдём, какую работу нужно совершить, чтобы разогнать тело массой $m$ из состояния покоя до скорости $v$.
fig: kin
p: Пусть на тело действует постоянная сила $F = ma$. Её работа $A = Fs = mas$. Из кинематики при $v_0 = 0$ путь равен $s = \dfrac{v^2}{2a}$.
p: Подставим: $A = ma\cdot\dfrac{v^2}{2a} = \dfrac{mv^2}{2}$. Эта работа запасается в теле в виде кинетической энергии: $E_{\text{к}} = \dfrac{mv^2}{2}$.
p: Энергия зависит от квадрата скорости: если скорость увеличить в 2 раза, кинетическая энергия вырастет в 4 раза.

@ cons-8
p: Поднимем тело массой $m$ на высоту $h$ равномерно. Для этого нужно приложить силу, равную силе тяжести $mg$, и совершить работу $A = mgh$.
fig: lifth
p: Эта работа запасается в виде потенциальной энергии: $E_{\text{п}} = mgh$.
p: Высоту $h$ отсчитывают от нулевого уровня, который выбирают сами, обычно это поверхность земли. В задачах важно изменение энергии, а оно от выбора нулевого уровня не зависит.
p: Формула работает вблизи поверхности Земли, где $g$ можно считать постоянным. В задачах ЕГЭ $g$ всегда считают постоянным и потенциальную энергию тела над землёй находят именно по этой формуле.

@ cons-9
p: При растяжении пружины сила упругости меняется: $F = kx$. Поэтому работу нельзя найти просто как силу, умноженную на перемещение.
fig: springx
fig: springAreaAnim
p: Воспользуемся графиком: работа равна площади под графиком силы. Под графиком треугольник с катетами $x$ и $kx$, его площадь $\dfrac{1}{2}\cdot x\cdot kx = \dfrac{kx^2}{2}$.
p: Эта работа запасается в пружине в виде потенциальной энергии: $E_{\text{п}} = \dfrac{kx^2}{2}$.
p: Энергия зависит от квадрата деформации: если растянуть пружину вдвое сильнее, энергии в ней будет в 4 раза больше.

@ cons-10
p: Изменение кинетической энергии тела равно работе всех сил, которые на него действуют: $A = E_{\text{к}2} - E_{\text{к}1}$.
fig: kinthmAnim
p: Вывод тот же, что и для кинетической энергии: работа постоянной силы $A = mas$, а $s = \dfrac{v_2^2 - v_1^2}{2a}$. Получаем $A = \dfrac{mv_2^2}{2} - \dfrac{mv_1^2}{2}$.
p: Если работа положительная, тело разгоняется, если отрицательная, тормозит. Например, машина массой 1000 кг затормозила с 20 до 10 м/с. Работа всех сил $A = \dfrac{1000\cdot 10^2}{2} - \dfrac{1000\cdot 20^2}{2} = 50\,000 - 200\,000 = -150\,000$ Дж. Работа отрицательная, машина тормозит.
p: Порядок важен: из конечной энергии вычитают начальную.

@ cons-11
p: Если на тело действуют только сила тяжести и сила упругости, а трения нет, полная механическая энергия сохраняется: $E_{\text{к}} + E_{\text{п}} = \text{const}$.
fig: energyAnim
p: Энергия при этом переходит из одного вида в другой. Падающее тело теряет потенциальную энергию и на столько же набирает кинетическую.
p: В задачах записывают энергию в двух точках и приравнивают: $E_{\text{к}1} + E_{\text{п}1} = E_{\text{к}2} + E_{\text{п}2}$. Например, для падения с высоты $h$: $mgh = \dfrac{mv^2}{2}$, откуда $v = \sqrt{2gh}$.
p: Если есть трение, механическая энергия уменьшается, и часть её переходит во внутреннюю. Тогда $E_1 = E_2 + |A_{\text{тр}}|$.

@ cons-12
p: Ни один механизм не отдаёт всю затраченную работу на полезное дело: часть уходит на трение, нагрев, сопротивление.
fig: kpd
p: Коэффициент полезного действия показывает, какая доля затраченной работы стала полезной: $\eta = \dfrac{A_{\text{пол}}}{A_{\text{затр}}}\cdot 100\%$.
p: Полезная работа всегда меньше затраченной, поэтому КПД меньше 100%. Если в ответе получилось больше, значит работы перепутаны местами.
p: Вместо работ можно подставлять мощности или энергии: $\eta = \dfrac{N_{\text{пол}}}{N_{\text{затр}}}\cdot 100\%$ или $\eta = \dfrac{E_{\text{пол}}}{E_{\text{затр}}}\cdot 100\%$.

@ osc-1
p: Гармонические колебания – колебания, при которых смещение от положения равновесия меняется со временем по закону косинуса или синуса: $x = A\cos(\omega t + \varphi_0)$.
fig: cosine
p: Где $A$ – амплитуда, наибольшее смещение от положения равновесия; $\omega$ – циклическая частота; $\varphi_0$ – начальная фаза, она показывает, где было тело в момент $t = 0$.
p: Выражение в скобках называют фазой колебаний. За один период фаза меняется на $2\pi$, и движение повторяется.
p: Положение равновесия – точка $x = 0$, где тело покоилось бы, если его не раскачивать. У пружинного маятника в ней пружина не растянута и не сжата, у нитяного нить висит вертикально.
p: Какую функцию брать, зависит от того, где было тело в момент $t = 0$. Если в крайнем положении, $x = A$, берём косинус с $\varphi_0 = 0$ (рисунок 1).
fig: phcos
p: Если тело проходило положение равновесия $x = 0$ и двигалось в сторону $A$, берём синус с $\varphi_0 = 0$ (рисунок 2).
fig: phsin
p: Если тело было где-то между ними, нужна начальная фаза, и тогда уже неважно, синус или косинус (рисунок 3). Они отличаются только сдвигом фазы на $\dfrac{\pi}{2}$: $\cos\alpha = \sin\left(\alpha + \dfrac{\pi}{2}\right)$, и этот сдвиг просто войдёт в $\varphi_0$.
fig: phmix

@ osc-2
p: Частота колебаний равна числу полных колебаний за единицу времени: $\nu = \dfrac{N}{t}$. Размерность – герц: 1 Гц соответствует одному колебанию в секунду.
fig: cosine | За время $t$ тело совершает $N$ полных колебаний. На графике одно колебание – это один повтор кривой длиной $T$.
p: Период – время одного полного колебания: $T = \dfrac{t}{N}$. Частота и период обратны друг другу: $\nu = \dfrac{1}{T}$.
p: Например, маятник совершил 30 колебаний за 1 минуту. Тогда $\nu = \dfrac{30}{60} = 0{,}5$ Гц, а $T = 2$ с.
p: Частая ошибка – перевернуть дробь. Проверка: чем больше колебаний за то же время, тем больше частота, значит $N$ стоит в числителе.

@ osc-3
p: За один период фаза колебаний $\omega t$ должна измениться на $2\pi$, тогда движение повторится: $\omega T = 2\pi$.
fig: cosine | За время $T$ фаза меняется на $2\pi$, и график начинает повторяться.
p: Отсюда $\omega = \dfrac{2\pi}{T}$. Так как $\dfrac{1}{T} = \nu$, получаем $\omega = 2\pi\nu$.
p: Циклическую частоту измеряют в рад/с, а частоту в герцах. Это разные величины: $\omega$ больше $\nu$ в $2\pi$ раз.
p: Связь такая же, как у угловой скорости при движении по окружности: там за один оборот на $2\pi$ меняется угол, здесь за одно колебание на $2\pi$ меняется фаза.

@ osc-4
p: Математический маятник – материальная точка, подвешенная на невесомой нерастяжимой нити. Модель работает, если груз мал по сравнению с длиной нити, а отклонения небольшие.
fig: pendanim
p: Период малых колебаний: $T = 2\pi\sqrt{\dfrac{l}{g}}$.
p: Масса в формулу не входит, поэтому период от неё не зависит: на нити одной длины можно качать любое тело, лёгкое или тяжёлое, и период будет одинаковым. От амплитуды он тоже не зависит, пока отклонения малы.
p: Чем длиннее нить, тем медленнее колебания. На планете с меньшим $g$ маятник качается медленнее.

@ osc-5
p: Пружинный маятник – груз массой $m$ на пружине жёсткостью $k$. Если вывести груз из положения равновесия, сила упругости будет возвращать его обратно.
fig: springanim
p: Период колебаний: $T = 2\pi\sqrt{\dfrac{m}{k}}$.
p: Тяжёлый груз труднее разогнать и остановить, поэтому с ростом массы период растёт. Жёсткая пружина возвращает груз сильнее, поэтому с ростом жёсткости период уменьшается.
p: Период не зависит от амплитуды и от $g$. На Луне такой маятник колебался бы с тем же периодом.

@ osc-6
p: При гармонических колебаниях $x = A\cos\omega t$ скорость тоже меняется гармонически: $v_x = -A\omega\sin\omega t$.
fig: oscvel
p: Синус по модулю не больше единицы, поэтому наибольшая скорость равна $v_{\max} = \omega A$.
p: Скорость максимальна, когда тело проходит положение равновесия. В крайних точках тело на мгновение останавливается, и скорость равна нулю.
p: Так же находится максимальное ускорение: $a_{\max} = \omega^2 A$. Оно, наоборот, наибольшее в крайних точках.

@ osc-7
p: При колебаниях пружинного маятника без трения полная механическая энергия сохраняется. Она переходит из потенциальной энергии пружины в кинетическую энергию груза и обратно.
fig: oscen
p: В крайнем положении груз останавливается, а деформация максимальна: $E = \dfrac{kA^2}{2}$.
p: В положении равновесия пружина не деформирована, а скорость максимальна: $E = \dfrac{mv_{\max}^2}{2}$. Приравниваем: $\dfrac{kA^2}{2} = \dfrac{mv_{\max}^2}{2}$.
p: Из этого равенства удобно находить максимальную скорость: $v_{\max} = A\sqrt{\dfrac{k}{m}} = \omega A$.

@ osc-8
p: Волна – колебания, которые распространяются в пространстве. Длина волны $\lambda$ – расстояние, на которое волна распространяется за один период.
fig: waveanim
p: Волна движется с постоянной скоростью $v$, поэтому за время $T$ она проходит расстояние $\lambda = vT$.
p: Так как $T = \dfrac{1}{\nu}$, можно записать и так: $\lambda = \dfrac{v}{\nu}$, или $v = \lambda\nu$.
p: На рисунке длину волны удобно искать как расстояние между соседними гребнями. При переходе волны в другую среду частота не меняется, а скорость и длина волны меняются.

@ dyn-9
p: Сила тяжести – сила, с которой Земля притягивает тело. Она приложена к самому телу и направлена вертикально вниз: $F_{\text{т}} = mg$.
fig: weight
p: Вес – это другая сила: с ней тело давит на опору или растягивает подвес. Вес приложен не к телу, а к опоре.
p: Если тело покоится на горизонтальной опоре, по третьему закону Ньютона $P = N$, а из равновесия $N = mg$. Поэтому в этом случае вес численно равен силе тяжести.
p: Вблизи поверхности Земли $g \approx 10$ м/с², это значение и берут в задачах ЕГЭ.

@ dyn-10
p: Пусть лифт движется с ускорением, направленным вниз: разгоняется вниз или тормозит, поднимаясь вверх. На тело действуют сила тяжести $mg$ и сила реакции опоры $N$.
fig: liftDownAnim
p: Направим ось вниз и запишем второй закон Ньютона: $mg - N = ma$, откуда $N = m(g - a)$. По третьему закону Ньютона вес равен силе реакции опоры: $P = m(g - a)$.
p: Вес становится меньше силы тяжести. Если $a = g$, например лифт свободно падает, вес равен нулю – это невесомость.
p: Важно направление ускорения, а не скорости: лифт, который едет вверх и тормозит, тоже уменьшает вес.

@ dyn-11
p: На тело массой $m$ на поверхности планеты действует сила тяготения $G\dfrac{mM}{R^2}$. Эта же сила сообщает телу ускорение свободного падения: $mg = G\dfrac{mM}{R^2}$.
fig: gsurf
p: Сократим массу тела и получим $g = G\dfrac{M}{R^2}$. Ускорение свободного падения не зависит от массы тела, только от массы и радиуса планеты.
p: На высоте $h$ над поверхностью в знаменателе стоит $(R + h)^2$, поэтому с высотой $g$ уменьшается. Это легко запомнить: далеко в космосе, на большом расстоянии от Земли, её притяжение почти не чувствуется.
p: Во второй части эту формулу лучше выводить из закона всемирного тяготения, как показано выше, а не просто записывать.

@ stat-7
p: Плотность показывает, какая масса вещества приходится на единицу объёма: $\rho = \dfrac{m}{V}$. Отсюда масса тела $m = \rho V$.
p: Плотность воды – 1000 кг/м³, то есть кубометр воды имеет массу 1 т. Плотность зависит от вещества, а не от размеров тела.
p: В задачах объём часто дан в литрах или см³: 1 л = 10⁻³ м³, 1 см³ = 10⁻⁶ м³. Переводить нужно до подстановки.
p: Формула нужна почти в каждой задаче на гидростатику: масса вытесненной жидкости $\rho_{\text{ж}}V_{\text{погр}}$, масса тела $\rho_{\text{т}}V_{\text{т}}$.

@ stat-8
p: Тело с осью вращения находится в равновесии, если сумма моментов сил, вращающих его по часовой стрелке, равна сумме моментов, вращающих против часовой: $M_{\text{по}} = M_{\text{против}}$.
fig: moments
p: Направление вращения всегда смотрим относительно оси – на рисунке это точка O, вокруг которой рычаг может поворачиваться. Каждый момент считаем как $Fl$, где $l$ – плечо силы, расстояние от O до линии действия силы. Если линия действия силы проходит через ось, её момент равен нулю.
p: Для полного равновесия тела нужно ещё, чтобы сумма всех сил была равна нулю. Во второй части обычно записывают оба условия.

@ stat-9
p: Центр масс – точка, которая движется так, будто в ней сосредоточена вся масса системы. Для двух тел на одной прямой его координата $x_{\text{ц}} = \dfrac{m_1x_1 + m_2x_2}{m_1 + m_2}$.
fig: cmAnim
p: Это «взвешенное среднее» координат: центр масс ближе к более тяжёлому телу. Если массы равны, он ровно посередине: $x_{\text{ц}} = \dfrac{x_1 + x_2}{2}$.
p: Если тел больше, в числитель и знаменатель добавляются слагаемые $m_3x_3$, $m_3$ и так далее. У однородного тела правильной формы центр масс совпадает с геометрическим центром.
p: Если тело подпереть или подвесить в центре масс, сила тяжести не создаёт момента, и тело находится в равновесии.

@ stat-10
p: На поверхность жидкости давит атмосфера с давлением $p_0 \approx 10^5$ Па. По закону Паскаля это давление передаётся в каждую точку жидкости.
fig: patm
p: Поэтому полное давление на глубине $h$ складывается из атмосферного и давления столба жидкости: $p = p_0 + \rho g h$.
p: Столб воды высотой 10 м создаёт давление $1000 \cdot 10 \cdot 10 = 10^5$ Па, примерно одну атмосферу. Значит, на глубине 10 м давление уже вдвое больше, чем у поверхности.
p: Если над жидкостью вакуум или в задаче нужно только давление самой жидкости, $p_0$ не добавляют. Внимательно читайте условие.

@ stat-11
p: Тело плавает, если сила тяжести уравновешена силой Архимеда: $mg = \rho_{\text{ж}}\, g\, V_{\text{погр}}$.
fig: floatAnim
p: Сократим $g$ и получим удобную форму: $m = \rho_{\text{ж}}V_{\text{погр}}$. Масса плавающего тела равна массе вытесненной им жидкости.
p: Так как $m = \rho_{\text{т}}V_{\text{т}}$, доля погружённого объёма равна отношению плотностей: $\dfrac{V_{\text{погр}}}{V_{\text{т}}} = \dfrac{\rho_{\text{т}}}{\rho_{\text{ж}}}$. Например, лёд с плотностью 900 кг/м³ погружён в воду на 90%.
p: Если перенести плавающее тело в другую жидкость, сила Архимеда останется равной $mg$. Изменится только глубина погружения: в более плотной жидкости тело погрузится меньше.
fig: floatTwo

@ stat-12
p: В сообщающиеся сосуды налили две несмешивающиеся жидкости, например масло и воду. Проведём горизонталь через границу между ними.
fig: utubeAnim
p: На этой горизонтали давление в обоих коленах одинаковое, иначе жидкость перетекала бы. Над ней слева столб одной жидкости, справа – другой: $\rho_1 g h_1 = \rho_2 g h_2$. Сократим $g$: $\rho_1 h_1 = \rho_2 h_2$.
p: Высоты обратно пропорциональны плотностям: столб более лёгкой жидкости выше. Поэтому масло стоит выше воды.
p: Если жидкость одна и та же, $\rho_1 = \rho_2$, то и $h_1 = h_2$: уровень жидкости во всех коленах одинаковый, какой бы формы они ни были.
fig: vessels

@ cons-13
p: Абсолютно неупругий удар – удар, после которого тела слипаются и движутся вместе с общей скоростью $v$. Например, пуля застревает в бруске или вагон сцепляется с другим вагоном.
fig: inelasticAnim
p: Импульс системы сохраняется, а после удара это одно тело массой $m_1 + m_2$: $m_1v_1 + m_2v_2 = (m_1 + m_2)v$.
p: Скорости записываем в проекциях: если тела двигались навстречу, одна из проекций отрицательная.
p: Механическая энергия при таком ударе не сохраняется: часть кинетической энергии переходит во внутреннюю. Закон сохранения энергии здесь использовать нельзя, только закон сохранения импульса.

@ cons-14
p: Когда тело опускается с высоты $h_1$ на высоту $h_2$, сила тяжести совершает работу $A = mg(h_1 - h_2)$.
fig: workg
p: Работа не зависит от формы траектории: по прямой, по дуге или ступеньками – важны только начальная и конечная высоты. Такие силы называют потенциальными.
p: При спуске работа положительная, при подъёме отрицательная. По замкнутой траектории работа силы тяжести равна нулю.
p: Через потенциальную энергию: $A = E_{\text{п}1} - E_{\text{п}2}$. Работа силы тяжести равна убыли потенциальной энергии.

@ cons-15
p: Сила трения скольжения направлена против движения, угол между ней и перемещением $180^\circ$, а $\cos 180^\circ = -1$. Поэтому её работа отрицательная: $A_{\text{тр}} = -F_{\text{тр}}s$.
fig: workfr
p: Здесь $s$ – путь, а не перемещение. Если тело проехало туда и обратно, трение совершало отрицательную работу на всём пути, и в ноль она не обращается.
p: Если тело скользит по горизонтали, $F_{\text{тр}} = \mu mg$, и $A_{\text{тр}} = -\mu mgs$.
p: Работа трения уменьшает механическую энергию тела: эта энергия переходит во внутреннюю, и тела нагреваются.

@ cons-16
p: Если на тело действует трение или сопротивление воздуха, механическая энергия не сохраняется. Её изменение равно работе этих сил: $A_{\text{тр}} = E_2 - E_1$, где $E = E_{\text{к}} + E_{\text{п}}$.
fig: hillAnim
p: Работа трения отрицательная, поэтому $E_2 < E_1$: механическая энергия уменьшается, а разница уходит в тепло.
p: В задачах удобно записывать так: $E_{\text{к}1} + E_{\text{п}1} + A_{\text{тр}} = E_{\text{к}2} + E_{\text{п}2}$, помня, что $A_{\text{тр}} < 0$. Или через модуль: $E_1 = E_2 + |A_{\text{тр}}|$.
p: Если трения нет, $A_{\text{тр}} = 0$, и получается закон сохранения механической энергии: $E_1 = E_2$.

@ mkt-1
p: Молекул в любом теле огромное количество, поэтому их считают не штуками, а молями. Один моль содержит столько частиц, сколько атомов в 12 г углерода: $N_A = 6\cdot 10^{23}$ моль⁻¹. Это число называют постоянной Авогадро.
p: Количество вещества показывает, сколько молей в теле: делим число молекул на число молекул в одном моле, $\nu = \dfrac{N}{N_A}$.
p: Например, $12\cdot 10^{23}$ молекул – это $\nu = \dfrac{12\cdot 10^{23}}{6\cdot 10^{23}} = 2$ моль.
p: Отсюда же находят число молекул: $N = \nu N_A$.

@ mkt-2
p: Молярная масса $M$ – масса одного моля вещества. Если масса тела $m$, то молей в нём $\nu = \dfrac{m}{M}$.
p: Молярную массу берут из таблицы Менделеева: число под элементом – это масса одного моля в граммах. Для кислорода $\text{O}_2$ это $2\cdot 16 = 32$ г/моль.
p: Главная ловушка – единицы. В формулы СИ подставляют кг/моль: 32 г/моль = 0,032 кг/моль.
p: Масса тоже в килограммах. Если $m$ в граммах, а $M$ в г/моль, отношение получится верным, но в других формулах такая смесь единиц приведёт к ошибке.

@ mkt-3
p: Моль содержит $N_A$ молекул, каждая массой $m_0$. Значит, масса моля равна $M = m_0 N_A$.
p: Отсюда масса одной молекулы: $m_0 = \dfrac{M}{N_A}$. Для воды $M = 0{,}018$ кг/моль, и $m_0 = \dfrac{0{,}018}{6\cdot 10^{23}} = 3\cdot 10^{-26}$ кг.
p: Похожая связь есть и для всего тела: $m = N m_0$. Разделив одно на другое, снова получим $\nu = \dfrac{m}{M} = \dfrac{N}{N_A}$.

@ mkt-4
p: Концентрация показывает, сколько молекул приходится на единицу объёма: $n = \dfrac{N}{V}$. Размерность – м⁻³.
fig: gasAnim | Молекулы газа хаотично движутся и ударяются о стенки. Чем больше молекул в единице объёма, тем чаще удары – и тем больше давление.
p: Концентрация не зависит от размера сосуда сама по себе: если в два раза больший сосуд вместит в два раза больше молекул, $n$ останется прежней.
p: Именно концентрация, а не просто число молекул, входит в формулы давления: $p = nkT$ и $p = \dfrac{1}{3}m_0nv^2$.

@ mkt-5
p: В физике температуру измеряют по абсолютной шкале, в кельвинах. Ноль этой шкалы – абсолютный ноль, при котором прекратилось бы тепловое движение молекул. Он равен примерно $-273\ {}^\circ\text{C}$.
fig: kelvin
p: Один кельвин равен одному градусу Цельсия, поэтому шкалы просто сдвинуты: $T = t + 273$. Например, $27\ {}^\circ\text{C} = 300$ К.
p: Изменения температуры в обеих шкалах одинаковые: $\Delta T = \Delta t$. Поэтому в $Q = cm\Delta t$ можно брать градусы Цельсия.
p: Во все формулы МКТ и газовых законов подставляют только кельвины. Если подставить градусы Цельсия, ответ будет неверным.

@ mkt-6
p: Температура – это мера средней кинетической энергии хаотичного движения молекул. Чем горячее газ, тем быстрее движутся его молекулы.
p: Для одноатомного идеального газа эта связь точная: $E_{\text{к}} = \dfrac{3}{2}kT$, где $k = 1{,}38\cdot 10^{-23}$ Дж/К – постоянная Больцмана.
p: Энергия прямо пропорциональна абсолютной температуре: если $T$ увеличить в 2 раза, средняя энергия молекулы тоже вырастет в 2 раза.
p: Формула не зависит от сорта газа: при одной температуре у молекул водорода и кислорода средняя кинетическая энергия одинаковая, хотя скорости разные.

@ mkt-7
p: Приравняем кинетическую энергию молекулы $\dfrac{m_0v^2}{2}$ к её средней энергии $\dfrac{3}{2}kT$ и выразим скорость: $v = \sqrt{\dfrac{3kT}{m_0}}$.
p: Это среднеквадратичная скорость – корень из среднего квадрата скоростей всех молекул.
p: Умножив числитель и знаменатель на $N_A$, получим удобную форму: $v = \sqrt{\dfrac{3RT}{M}}$. Здесь $R = kN_A$, а $M = m_0N_A$.
p: Скорость растёт как корень из температуры: чтобы скорость выросла вдвое, температуру нужно увеличить в 4 раза. Лёгкие молекулы при той же температуре движутся быстрее тяжёлых.

@ mkt-8
p: Давление газа создают удары молекул о стенки сосуда. Каждая молекула при ударе передаёт стенке импульс, а вместе они давят с постоянной средней силой.
fig: gasAnim | Молекулы летят с разными скоростями и ударяются о стенки. Давление – результат этих ударов.
p: Расчёт даёт основное уравнение МКТ: $p = \dfrac{1}{3}m_0nv^2$. Давление тем больше, чем тяжелее молекулы, чем их больше в единице объёма и чем быстрее они движутся.
p: Коэффициент $\dfrac{1}{3}$ появляется потому, что молекулы летят во всех трёх направлениях, и на каждую стенку в среднем приходится треть движения.

@ mkt-9
p: В основном уравнении МКТ есть кинетическая энергия молекулы: $m_0v^2 = 2E_{\text{к}}$.
p: Подставим: $p = \dfrac{1}{3}n\cdot 2E_{\text{к}} = \dfrac{2}{3}nE_{\text{к}}$.
p: Давление газа пропорционально концентрации молекул и их средней кинетической энергии.
p: Частая ошибка – перепутать дробь: здесь $\dfrac{2}{3}$, а в формуле энергии $\dfrac{3}{2}kT$. Проверка: подставив одну в другую, должны получить $p = nkT$.

@ mkt-10
p: Подставим в $p = \dfrac{2}{3}nE_{\text{к}}$ среднюю энергию $E_{\text{к}} = \dfrac{3}{2}kT$. Дроби сокращаются, и получается простая формула: $p = nkT$.
fig: gasHot
p: При одинаковой температуре и одинаковой концентрации любые газы создают одинаковое давление. Сорт газа здесь неважен.
p: Если нагреть газ в закрытом сосуде, $n$ не меняется, а $T$ растёт, поэтому давление растёт пропорционально абсолютной температуре.

@ mkt-11
p: Если в сосуде смесь газов, каждый газ ведёт себя так, будто других нет, и создаёт своё парциальное давление.
fig: dalton
p: Полное давление смеси равно сумме парциальных давлений: $p = p_1 + p_2 + \ldots + p_n$. Это закон Дальтона.
p: Например, воздух – смесь азота, кислорода и других газов, а его давление складывается из их давлений. Водяной пар в воздухе тоже создаёт своё парциальное давление – это понадобится в теме «Влажность».

@ iso-1
p: Возьмём $p = nkT$ и распишем концентрацию: $n = \dfrac{N}{V} = \dfrac{\nu N_A}{V}$. Получим $pV = \nu N_AkT$.
p: Произведение $kN_A$ – универсальная газовая постоянная $R = 8{,}31$ Дж/(моль·К). Отсюда уравнение состояния идеального газа: $pV = \nu RT$.
p: Уравнение связывает все параметры газа: давление, объём, температуру и количество вещества. Зная три из них, найдём четвёртую.
p: Все величины – в СИ: давление в паскалях, объём в м³ (1 л = $10^{-3}$ м³), температура в кельвинах.

@ iso-2
p: Подставим в уравнение Менделеева–Клапейрона количество вещества $\nu = \dfrac{m}{M}$: $pV = \dfrac{m}{M}RT$.
p: Эта форма удобна, когда в задаче дана масса газа, а не количество вещества.
p: Не забывайте переводить молярную массу в кг/моль: для азота $\text{N}_2$ это 0,028 кг/моль, для гелия 0,004 кг/моль.

@ iso-3
p: Разделим обе части $pV = \dfrac{m}{M}RT$ на объём. Отношение $\dfrac{m}{V}$ – это плотность газа $\rho$: $p = \dfrac{\rho RT}{M}$.
p: Эта форма нужна, когда в задаче спрашивают плотность газа или она дана, а объём и масса неизвестны.
p: Из формулы видно: при одинаковых давлении и температуре плотность газа пропорциональна его молярной массе. Поэтому гелий легче воздуха, а углекислый газ тяжелее.

@ iso-4
p: Изопроцесс – процесс, в котором количество газа не меняется, и не меняется ещё один параметр. Изотермический процесс идёт при постоянной температуре: $T = \text{const}$.
fig: isoT
p: Из $pV = \nu RT$ при постоянных $\nu$ и $T$ произведение $pV$ не меняется: $p_1V_1 = p_2V_2$. Это закон Бойля–Мариотта.
p: Давление обратно пропорционально объёму: сожмём газ вдвое – давление вырастет вдвое. График $p(V)$ – гипербола, её называют изотермой.
p: Чем выше изотерма на графике $p(V)$, тем больше температура. На графиках $p(T)$ и $V(T)$ изотерма – вертикальная прямая.

@ iso-5
p: Изобарный процесс идёт при постоянном давлении: $p = \text{const}$. Например, газ под свободно движущимся поршнем.
fig: isoP
p: Из $pV = \nu RT$ при постоянных $p$ и $\nu$ отношение $\dfrac{V}{T}$ не меняется: $\dfrac{V_1}{T_1} = \dfrac{V_2}{T_2}$. Это закон Гей-Люссака.
p: Объём прямо пропорционален абсолютной температуре. График $V(T)$ – прямая, продолжение которой проходит через начало координат (у самого начала её рисуют пунктиром: к абсолютному нулю газ не охладить).
p: Чем круче изобара на графике $V(T)$, тем меньше давление. На графиках $p(V)$ и $p(T)$ изобара – горизонтальная прямая.

@ iso-6
p: Изохорный процесс идёт при постоянном объёме: $V = \text{const}$. Например, газ в закрытом жёстком баллоне.
fig: isoV
p: Из $pV = \nu RT$ при постоянных $V$ и $\nu$ отношение $\dfrac{p}{T}$ не меняется: $\dfrac{p_1}{T_1} = \dfrac{p_2}{T_2}$. Это закон Шарля.
p: Давление прямо пропорционально абсолютной температуре. Поэтому баллоны с газом нельзя нагревать: давление в них растёт.
p: Чем круче изохора на графике $p(T)$, тем меньше объём. На графиках $p(V)$ и $V(T)$ изохора – вертикальная и горизонтальная прямые.

@ hum-1
p: Над водой всегда есть водяной пар. Если пар находится в равновесии с жидкостью – сколько молекул вылетает, столько и возвращается, – его называют насыщенным. Его давление $p_{\text{н}}$ – максимально возможное при данной температуре.
fig: humid
p: Относительная влажность показывает, насколько пар в воздухе близок к насыщению: $\varphi = \dfrac{p}{p_{\text{н}}}\cdot 100\%$, где $p$ – парциальное давление пара в воздухе.
p: Давление насыщенного пара сильно растёт с температурой и берётся из таблицы при температуре воздуха.
p: При нагревании воздуха $p$ почти не меняется, а $p_{\text{н}}$ растёт, поэтому влажность падает. При охлаждении влажность растёт, а когда дойдёт до 100%, выпадает роса.

@ hum-2
p: Давление пара пропорционально его плотности при той же температуре: $p = \dfrac{\rho RT}{M}$. Поэтому влажность можно считать и через плотности: $\varphi = \dfrac{\rho}{\rho_{\text{н.п.}}}\cdot 100\%$.
p: Плотность водяного пара $\rho$ называют абсолютной влажностью – это масса пара в 1 м³ воздуха.
p: Влажность не может быть больше 100%. Если по расчёту выходит больше, значит, лишний пар сконденсировался, и в ответе $\varphi = 100\%$.
p: Если сжать воздух с паром при постоянной температуре, плотность пара растёт, а $\rho_{\text{н.п.}}$ не меняется – влажность растёт.

@ hum-3
p: Давление пара $p = nkT$ пропорционально концентрации его молекул. При одной и той же температуре отношение давлений равно отношению концентраций: $\varphi = \dfrac{n}{n_{\text{н.п.}}}\cdot 100\%$.
p: Все три формулы влажности – через давление, плотность и концентрацию – выражают одно и то же. Выбирают ту, в которой даны величины из условия.
p: Во всех трёх в знаменателе стоит значение для насыщенного пара при той же температуре, что и у воздуха.

@ hum-4
p: Жидкость кипит, когда пузырьки пара внутри неё начинают расти и всплывать. Пузырёк может расти, если давление насыщенного пара внутри него не меньше давления снаружи.
fig: bubble
p: Снаружи на пузырёк на глубине $h$ давит атмосфера и столб жидкости: $p_{\text{н.п.}} = p_0 + \rho g h$. У поверхности вклад $\rho g h$ мал, и условие кипения – $p_{\text{н.п.}} = p_0$.
p: При нормальном давлении $10^5$ Па давление насыщенного пара воды достигает этого значения при 100 °C – поэтому вода кипит при 100 °C. В горах давление ниже, и вода кипит при меньшей температуре.
p: Во время кипения температура жидкости не меняется: вся подводимая теплота идёт на парообразование.

@ heat-1
p: Чтобы нагреть тело, ему нужно передать количество теплоты $Q = cm\Delta t$. Здесь $c$ – удельная теплоёмкость: сколько джоулей нужно, чтобы нагреть 1 кг вещества на 1 °C.
fig: waterHeat
p: У воды удельная теплоёмкость большая – 4200 Дж/(кг·°C), поэтому вода долго нагревается и долго остывает. У металлов она в несколько раз меньше.
p: При охлаждении тело отдаёт такое же количество теплоты по той же формуле. Если считать $\Delta t = t_{\text{кон}} - t_{\text{нач}}$, то при охлаждении $Q$ получится отрицательным – тело отдаёт тепло.
p: Изменение температуры можно брать в градусах Цельсия: $\Delta t = \Delta T$.

@ heat-2
p: При плавлении кристаллического тела температура не меняется, пока всё тело не расплавится. Теплота идёт на разрушение кристаллической решётки: растёт потенциальная энергия молекул, а кинетическая не меняется.
fig: waterMelt
p: Количество теплоты для плавления тела массой $m$ при температуре плавления: $Q = \lambda m$, где $\lambda$ – удельная теплота плавления. Для льда $\lambda = 3{,}3\cdot 10^5$ Дж/кг.
p: При кристаллизации тело отдаёт ровно столько же теплоты, сколько получило при плавлении.
p: Если тело сначала надо нагреть до температуры плавления, теплоты складываются: $Q = cm\Delta t + \lambda m$. На графике это наклонный участок, а затем горизонтальная площадка.

@ heat-3
p: Чтобы превратить жидкость в пар при температуре кипения, нужно количество теплоты $Q = Lm$, где $L$ – удельная теплота парообразования.
fig: waterBoil
p: Для воды $L = 2{,}3\cdot 10^6$ Дж/кг – почти в 7 раз больше, чем теплота плавления льда. Поэтому выкипает вода гораздо дольше, чем тает лёд той же массы.
p: При конденсации пар отдаёт такую же теплоту. Поэтому ожог паром опаснее, чем кипятком: пар сначала конденсируется и отдаёт $Lm$, а потом ещё остывает.

@ heat-4
p: При сгорании топлива выделяется количество теплоты $Q = qm$, где $q$ – удельная теплота сгорания: сколько джоулей выделяется при сгорании 1 кг топлива.
p: Удельная теплота сгорания бензина около $4{,}6\cdot 10^7$ Дж/кг, дров – около $10^7$ Дж/кг.
p: В задачах топливом обычно что-то нагревают. Если часть теплоты теряется, используют КПД: полезная теплота $Q_{\text{пол}} = \eta\, qm$.

@ heat-5
p: Теплоёмкость тела $C$ показывает, сколько теплоты нужно, чтобы нагреть всё тело на 1 °C. Она зависит и от вещества, и от массы: $C = cm$.
p: Через теплоёмкость количество теплоты записывается короче: $Q = C\Delta t$. Так часто задают калориметр или сосуд, масса и материал которого неизвестны.
p: Не путайте: удельная теплоёмкость $c$ – свойство вещества, Дж/(кг·°C). Теплоёмкость $C$ – свойство конкретного тела, Дж/°C.

@ heat-6
p: Если горячее и холодное тело привести в контакт и не давать теплу уходить наружу, горячее отдаёт теплоту, холодное получает, пока их температуры не сравняются.
fig: balanceAnim
p: Энергия не теряется, поэтому сколько теплоты отдали горячие тела, столько получили холодные: $Q_{\text{отд}} = Q_{\text{пол}}$.
p: Обе теплоты при такой записи берут положительными: для горячего тела $cm(t_{\text{нач}} - \theta)$, для холодного $cm(\theta - t_{\text{нач}})$, где $\theta$ – общая конечная температура.
p: Другая запись: $Q_1 + Q_2 + \ldots = 0$, где у отдающих тел теплота со знаком минус. Если по ходу тело плавится или кипит, в уравнение добавляют $\lambda m$ или $Lm$.
fig: waterCycle
p: Удобно представлять путь каждого тела по этому графику: например, лёд из морозилки, брошенный в чай, проходит участки 1, 2 и 3, а чай – участок 8. Для каждого участка пишем свою теплоту и складываем.

@ td-1
p: Внутренняя энергия газа – это суммарная энергия движения и взаимодействия всех его молекул. В идеальном газе молекулы не взаимодействуют, поэтому остаётся только кинетическая энергия.
p: У $N$ молекул средняя энергия каждой $\dfrac{3}{2}kT$, значит $U = N\cdot\dfrac{3}{2}kT = \dfrac{3}{2}\nu N_AkT = \dfrac{3}{2}\nu RT$.
p: Внутренняя энергия идеального газа зависит только от температуры и количества вещества. Нет изменения температуры – нет изменения внутренней энергии.
p: Формула верна для одноатомного газа (гелий, неон, аргон). Для двухатомного газа коэффициент другой: $\dfrac{5}{2}$.

@ td-2
p: По уравнению Менделеева–Клапейрона $\nu RT = pV$. Подставим в $U = \dfrac{3}{2}\nu RT$ и получим $U = \dfrac{3}{2}pV$.
p: Эта форма удобна для задач с графиками $p(V)$: внутреннюю энергию в любой точке можно найти сразу по координатам точки.
p: Например, если в процессе произведение $pV$ выросло, значит, выросла и температура, и внутренняя энергия.

@ td-3
p: Внутренняя энергия идеального газа зависит только от температуры, поэтому её изменение: $\Delta U = \dfrac{3}{2}\nu R\Delta T$.
p: Знак $\Delta U$ совпадает со знаком изменения температуры: газ нагрелся – внутренняя энергия выросла, остыл – уменьшилась.
p: $\Delta U$ не зависит от того, каким путём газ перешёл из одного состояния в другое, – важны только начальная и конечная температуры.
p: В изотермическом процессе $\Delta T = 0$, поэтому $\Delta U = 0$.

@ td-4
p: Газ, расширяясь, толкает поршень и совершает работу. При постоянном давлении сила давления на поршень $F = pS$ постоянна, а поршень сдвигается на $l$: $A = Fl = pSl = p\Delta V$.
fig: workAnim
p: На графике $p(V)$ работа газа равна площади под графиком процесса. При постоянном давлении это прямоугольник.
p: Если газ расширяется, $\Delta V > 0$ и работа газа положительная. При сжатии работа газа отрицательная. При постоянном объёме газ работу не совершает.
p: Если давление меняется, формулой $p\Delta V$ пользоваться нельзя – работу находят как площадь под графиком, например трапеции.

@ td-5
p: Когда газ расширяется, он совершает работу $A$ над внешними телами. Когда его сжимают, работу совершают внешние силы.
p: По третьему закону Ньютона газ и поршень действуют друг на друга с равными и противоположными силами, а перемещения у них одинаковые. Поэтому работы равны по модулю и противоположны по знаку: $A_{\text{в.с}} = -A$.
p: В первом законе термодинамики в форме $Q = A + \Delta U$ стоит работа газа. Если в задаче дана работа внешних сил, её сначала переводят в работу газа со знаком минус.

@ td-6
p: Теплоту, переданную газу, можно потратить на две вещи: на увеличение внутренней энергии и на работу газа. Это закон сохранения энергии для тепловых процессов: $Q = A + \Delta U$.
fig: firstLaw
p: Знаки: $Q > 0$ – газ получает теплоту, $Q < 0$ – отдаёт. $A > 0$, если газ расширяется. $\Delta U > 0$, если газ нагревается.
p: В частных случаях закон упрощается. Изохорный процесс: $A = 0$, и $Q = \Delta U$. Изотермический: $\Delta U = 0$, и $Q = A$.
p: В изобарном процессе работают оба слагаемых: газ и нагревается, и совершает работу, поэтому теплоты нужно больше, чем при изохорном нагревании на те же градусы.

@ td-7
p: Адиабатный процесс – процесс без теплообмена с окружающей средой: $Q = 0$. Так бывает при очень быстром сжатии или расширении или в теплоизолированном сосуде.
fig: adiabat
p: Из первого закона: $0 = A + \Delta U$, то есть $A = -\Delta U$. Газ совершает работу за счёт своей внутренней энергии.
p: При адиабатном расширении газ совершает работу и охлаждается. При адиабатном сжатии над газом совершают работу, и он нагревается – так воспламеняется топливо в дизельном двигателе.
p: На графике $p(V)$ адиабата идёт круче изотермы: при расширении давление падает и из-за роста объёма, и из-за охлаждения.

@ eng-1
p: Тепловой двигатель превращает теплоту в механическую работу. У любого двигателя есть нагреватель, рабочее тело (обычно газ) и холодильник.
fig: engine
p: За цикл рабочее тело получает от нагревателя теплоту $Q_{\text{н}}$, часть её отдаёт холодильнику – $Q_{\text{х}}$, а разница превращается в работу: $A = Q_{\text{н}} - Q_{\text{х}}$.
p: За полный цикл газ возвращается в исходное состояние, поэтому $\Delta U = 0$, и по первому закону вся полученная за цикл теплота равна работе.
p: Отдать часть теплоты холодильнику – обязательное условие работы любого теплового двигателя: без этого цикл не замкнуть.

@ eng-2
p: КПД показывает, какая часть теплоты от нагревателя превратилась в полезную работу: $\eta = \dfrac{A}{Q_{\text{н}}}\cdot 100\%$.
p: В знаменателе стоит именно теплота от нагревателя, а не от холодильника: это затраты, а работа – результат.
p: КПД теплового двигателя всегда меньше 100%, потому что часть теплоты неизбежно уходит холодильнику. У автомобильных двигателей КПД около 25–40%.
p: На графике $p(V)$ работа за цикл равна площади внутри цикла.

@ eng-3
p: Подставим в $\eta = \dfrac{A}{Q_{\text{н}}}$ работу $A = Q_{\text{н}} - Q_{\text{х}}$: $\eta = \dfrac{Q_{\text{н}} - Q_{\text{х}}}{Q_{\text{н}}}\cdot 100\%$.
p: То же самое можно записать как $\eta = \left(1 - \dfrac{Q_{\text{х}}}{Q_{\text{н}}}\right)\cdot 100\%$.
p: Эти формулы верны для любого цикла. Чем меньшую часть теплоты двигатель отдаёт холодильнику, тем выше КПД.

@ eng-4
p: Цикл Карно – идеальный цикл из двух изотерм и двух адиабат. При данных температурах нагревателя и холодильника у него самый большой возможный КПД.
fig: carnotAnim
p: КПД цикла Карно зависит только от температур: $\eta = \dfrac{T_{\text{н}} - T_{\text{х}}}{T_{\text{н}}}\cdot 100\%$. Температуры обязательно в кельвинах.
p: Никакой реальный двигатель с теми же нагревателем и холодильником не может иметь КПД больше, чем у цикла Карно. Поэтому формулу используют как предел.
p: КПД равнялся бы 100% только при $T_{\text{х}} = 0$ К, а абсолютный ноль недостижим. Поэтому КПД любого теплового двигателя меньше 100%.

<script>
const App = (() => {
  /* ---------- Телеграм: окружение, облако, навигация, вибрация ---------- */
  const tg = window.Telegram && window.Telegram.WebApp;
  const inTg = !!(tg && tg.initData);

  const cloudOK = inTg && tg.CloudStorage && tgAtLeast('6.9');
  if (inTg) {

  }
  const CHUNK = 3900;
  const cloudDirty = {};
  let cloudTimer = null;
  function cloudQueue(key, obj) {
    if (!cloudOK) return;
    cloudDirty[key] = obj;
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(cloudFlush, 700);
  }
  function cloudFlush() {
    for (const [key, obj] of Object.entries(cloudDirty)) {
      const str = JSON.stringify(obj), n = Math.max(1, Math.ceil(str.length / CHUNK));
      for (let i = 0; i < n; i++) tg.CloudStorage.setItem(`${key}_${i}`, str.slice(i * CHUNK, (i + 1) * CHUNK), () => {});
      tg.CloudStorage.setItem(`${key}_n`, String(n), () => {});
      delete cloudDirty[key];
    }
  }
  function cloudLoad(keys, done) {
    if (!cloudOK) return done({});
    let finished = false;
    const finish = v => { if (!finished) { finished = true; done(v); } };
    setTimeout(() => finish({}), 4000);
    try {
      tg.CloudStorage.getItems(keys.map(k => `${k}_n`), (err, counts) => {
        if (err || !counts) return finish({});

        if (!parts.length) return finish({});
        tg.CloudStorage.getItems(parts, (err2, vals) => {
          if (err2 || !vals) return finish({});
          const out = {};
          keys.forEach(k => {
            const n = +counts[`${k}_n`] || 0; if (!n) return;
            try { out[k] = JSON.parse(Array.from({ length: n }, (_, i) => vals[`${k}_${i}`] || '').join('')); } catch (e) {}
          });
          finish(out);
        });
      });
    } catch (e) { finish({}); }
  }

        t.items.push(f);
      } else if (line.startsWith('f: ')) f.f = line.slice(3);
      else if (line.startsWith('v: ')) f.v = line.slice(3).split(';').map(s => s.split(' — ').map(x => x.trim()));
      else if (line.startsWith('w: ')) f.w = line.slice(3).split(';;').map(s => s.trim());
      else if (line.startsWith('xg: ')) f.xg = line.slice(4).trim();
      else if (line.startsWith('nc: ')) f.noCalc = true;
      else if (line.startsWith('x: ')) { const [tg, ans] = line.slice(3).split(' :: '); (f.x ||= []).push({ target: tg.trim(), alts: ans.split(' || ').map(x => tokenize(x)) }); }
      else if (line.startsWith('e: ')) { const [lhs, ans] = line.slice(3).split(' :: '); const alts = ans.split(' || ').map(x => tokenize(x)); f.e = { lhs: lhs.trim(), tokens: alts[0], alts }; }
      else if (line.startsWith('b: ')) {
        const [tpl, ...extra] = line.slice(3).split(';;').map(s => s.trim());
        const slots = [...tpl.matchAll(/⟦([^⟧]+)⟧/g)].map(m => { const [c, g] = m[1].split('@'); return { c: c.trim(), g: g || null }; });
        f.b = { tpl, slots, extra };
      }

  const SECTIONS = [...new Set(TOPICS.map(t => t.code.split('.')[0]))].map(code => {
    const topics = TOPICS.filter(t => t.code.split('.')[0] === code);
    return { code, title: SECTION_TITLES[code] || `Раздел ${code}`, topics, items: topics.flatMap(t => t.items) };
  });
  const UPCOMING = [
    ['2', 'МКТ'],
    ['3', 'Термодинамика'],
    ['4', 'Электричество'],
    ['5', 'Магнетизм'],
    ['6', 'Оптика'],
    ['7', 'СТО'],
    ['8', 'Ядерная физика'],
    ['9', 'Квантовая физика']
  ];

  /* ---------- прогресс (позже: Telegram CloudStorage) ---------- */
  const KEY = 'formuly.progress.v1';
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { progress = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} cloudQueue('p', progress); };
  const lvl = id => progress[id] || 0;
  const MAX = 5;
  const SEEN_KEY = 'formuly.seen.v1';
  let seen = {};
  try { seen = JSON.parse(localStorage.getItem(SEEN_KEY) || '{}') || {}; } catch (e) { seen = {}; }
  const saveSeen = () => { try { localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); } catch (e) {} cloudQueue('s', seen); };
  /* интервальные повторения: когда формулу можно продвинуть на следующую клетку */
  const SCHED_KEY = 'formuly.sched.v1';
  let sched = {};
  try { sched = JSON.parse(localStorage.getItem(SCHED_KEY) || '{}') || {}; } catch (e) { sched = {}; }
  const saveSched = () => { try { localStorage.setItem(SCHED_KEY, JSON.stringify(sched)); } catch (e) {} cloudQueue('d', sched); };
  const DAY = 864e5;
  const WAIT = { 1: 1, 2: 1, 3: 3, 4: 7, 5: 14 };   // через сколько дней после достижения уровня можно получить следующую клетку
  const KEEP = 30;                                  // проверка выученной на 5 формулы
  const now = () => Date.now();
  const today0 = () => { const d = new Date(now()); d.setHours(0, 0, 0, 0); return +d; };
  const dueAt = id => sched[id] ? sched[id] : 0;
  const isDue = id => lvl(id) >= 1 && now() >= dueAt(id);
  const canAdvance = id => lvl(id) < 2 || now() >= dueAt(id);
  const whenLabel = t => {
    const d = Math.round((new Date(t).setHours(0, 0, 0, 0) - today0()) / DAY);
    return d <= 0 ? 'сегодня' : d === 1 ? 'завтра' : `через ${d} ${plural(d, 'день', 'дня', 'дней')}`;
  };
  const bump = (id, ok) => {
    const l = lvl(id); let counted = false;
    if (ok) {
      if (canAdvance(id)) {
        const nl = Math.min(MAX, l + 1), days = l === MAX ? KEEP : WAIT[nl];
        progress[id] = nl; sched[id] = days ? today0() + days * DAY : now(); counted = true;
      }
    } else { progress[id] = Math.max(0, l - 2); sched[id] = now(); }
    seen[id] = 1; save(); saveSeen(); saveSched();
    return { counted, due: dueAt(id) };
  };
  /* серия дней подряд: день засчитывается, когда за него решено 5 заданий */
  const STREAK_KEY = 'formuly.streak.v1', STREAK_MIN = 5;
  let streak = { d: '', n: 0, best: 0, t: '', c: 0 };
  try { streak = { ...streak, ...(JSON.parse(localStorage.getItem(STREAK_KEY) || '{}') || {}) }; } catch (e) {}
  const saveStreak = () => { try { localStorage.setItem(STREAK_KEY, JSON.stringify(streak)); } catch (e) {} cloudQueue('k', streak); };
  const dayKey = (off = 0) => { const d = new Date(now()); d.setDate(d.getDate() + off); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
  const streakNow = () => streak.d === dayKey() || streak.d === dayKey(-1) ? streak.n : 0;
  const doneToday = () => streak.d === dayKey();
  const leftToday = () => Math.max(0, STREAK_MIN - (streak.t === dayKey() ? streak.c : 0));
  let streakUp = false;                               // серия продлилась в этом раунде
  function streakTick() {
    const today = dayKey();
    if (streak.t !== today) { streak.t = today; streak.c = 0; }
    streak.c++;
    if (streak.c >= STREAK_MIN && streak.d !== today) {
      streak.n = streak.d === dayKey(-1) ? streak.n + 1 : 1; streak.d = today;
      streak.best = Math.max(streak.best || 0, streak.n); streakUp = true;
    }
    saveStreak();
  }
  const daysWord = n => plural(n, 'день', 'дня', 'дней');
  function streakLine() {
    const n = streakNow(), left = leftToday();
    const tail = doneToday() ? 'сегодня засчитан<br>возвращайся завтра, чтобы продолжить серию' : n ? `реши ещё ${left} ${plural(left, 'задание', 'задания', 'заданий')} сегодня, чтобы не прервать` : `реши ${left} ${plural(left, 'задание', 'задания', 'заданий')}, чтобы начать серию`;
    return `<div class="streak ${n ? 'on' : ''}"><span class="fire" aria-hidden="true">🔥</span><span><b class="num">${n}</b> ${daysWord(n)} подряд<br><small>${tail}</small></span></div>`;
  }
  /* ---------- достижения (хранятся на телефоне и в облаке Telegram) ---------- */
  const ACH_KEY = 'formuly.ach.v1';
  let ach = { got: {}, n: 0, calc: 0, modes: {}, expl: {}, solo: {}, row: 0, best: 0 };
  try { ach = { ...ach, ...(JSON.parse(localStorage.getItem(ACH_KEY) || '{}') || {}) }; } catch (e) {}
  const saveAch = () => { try { localStorage.setItem(ACH_KEY, JSON.stringify(ach)); } catch (e) {} cloudQueue('a', ach); };
  const ALL_MODES = ['pick', 'name', 'gap', 'build', 'write', 'expr', 'graph', 'calc'];
  const bestStreak = () => Math.max(streak.best || 0, streakNow());
  const ACHS = [

    { id: 's7', icon: '🔥', t: 'Неделя подряд', d: 'Занимайся семь дней подряд', p: () => [Math.min(bestStreak(), 7), 7] },
    { id: 's14', icon: '🔥', t: 'Две недели подряд', d: 'Занимайся 14 дней подряд', p: () => [Math.min(bestStreak(), 14), 14] },
    { id: 's30', icon: '🌋', t: 'Месяц подряд', d: 'Занимайся 30 дней подряд', p: () => [Math.min(bestStreak(), 30), 30] },
    { id: 'n100', icon: '🌱', t: 'Новичок', d: 'Реши 100 заданий', p: () => [Math.min(ach.n, 100), 100] },
    { id: 'n500', icon: '📘', t: 'Уже что-то знаем', d: 'Реши 500 заданий', p: () => [Math.min(ach.n, 500), 500] },
    { id: 'n2000', icon: '🧠', t: 'Знаток', d: 'Реши 2000 заданий', p: () => [Math.min(ach.n, 2000), 2000] },
    { id: 'n5000', icon: '👑', t: 'Решала', d: 'Реши 5000 заданий', p: () => [Math.min(ach.n, 5000), 5000] },
    { id: 'clean', icon: '✨', t: 'Чистая работа', d: 'Реши 10 заданий подряд без ошибок в «Тренировке». Отдельные режимы не считаются', p: () => [Math.min(ach.best, 10), 10] },
    { id: 'clean30', icon: '🎯', t: 'Снайпер', d: 'Реши 30 заданий подряд без ошибок в «Тренировке». Отдельные режимы не считаются', p: () => [Math.min(ach.best, 30), 30] },
    { id: 'clean70', icon: '💎', t: 'Безупречно', d: 'Реши 70 заданий подряд без ошибок в «Тренировке». Отдельные режимы не считаются', p: () => [Math.min(ach.best, 70), 70] },

    { id: 'why', icon: '🔍', t: 'Докопался до сути', d: 'Открой 10 пояснений «Откуда берётся формула»', p: () => [Math.min(Object.keys(ach.expl).length, 10), 10] },
    { id: 'why30', icon: '🔬', t: 'Исследователь', d: 'Открой 30 пояснений «Откуда берётся формула»', p: () => [Math.min(Object.keys(ach.expl).length, 30), 30] },
    { id: 'why70', icon: '📚', t: 'Профессор', d: 'Открой 70 пояснений «Откуда берётся формула»', p: () => [Math.min(Object.keys(ach.expl).length, 70), 70] },
    { id: 'calc100', icon: '🧮', t: 'Счетовод', d: 'Верно реши 100 задач в режиме «Посчитай»', p: () => [Math.min(ach.calc, 100), 100] },
    // раздел покорён: все формулы раздела выучены (4 клетки и больше)
    ...SECTIONS.map(sec => ({ id: 'sec' + sec.code, icon: '🎓', t: `Покорена тема: ${sec.title}`, d: `Выучи все формулы раздела «${sec.title}»`, p: () => [sec.items.filter(f => lvl(f.id) >= 4).length, sec.items.length] }))
  ];
  let achNew = [];                                    // открытые в этом раунде, для экрана результата
  function checkAch(quiet) {
    const fresh = [];
    for (const a of ACHS) { if (ach.got[a.id]) continue; const [c, g] = a.p(); if (c >= g) { ach.got[a.id] = Date.now(); fresh.push(a); } }

  }
  let toastT = null;

    if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }

  function openAch() {

      <div class="ov-card" role="dialog" aria-modal="true" aria-label="Достижения">

        </div>
        <div class="ach-list">
          ${ACHS.map(a => { const [c, g] = a.p(), on = !!ach.got[a.id]; return `
            <div class="ach ${on ? 'on' : ''}">
              <span class="ach-icon" aria-hidden="true">${a.icon}</span>
              <span class="ach-body"><b>${esc(a.t)}</b><small>${esc(a.d)}</small>
                ${on ? '' : g > 1 ? `<span class="ach-bar"><span style="width:${Math.round(c / g * 100)}%"></span></span><small class="num">${c + ' из ' + g}</small>` : ''}
              </span>
              ${on ? '<span class="ach-ok" aria-label="получено">✓</span>' : ''}
            </div>`; }).join('')}
        </div>
        <button class="btn btn-primary" data-ov-close>Понятно</button>
      </div>`;
