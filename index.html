  }
  /* просрочка: каждые 3 дня без повторения — минус клетка (но не ниже 1) */
  const DECAY = 3;
  let decayNotice = 0;
  function applyDecay() {
    let lost = 0;
    for (const f of ALL) {
      const l = lvl(f.id); if (l < 2) continue;
      if (!sched[f.id]) { sched[f.id] = now(); continue; }
      const over = now() - dueAt(f.id);
      if (over < DECAY * DAY) continue;
      const k = Math.floor(over / (DECAY * DAY)), nl = Math.max(1, l - k);
      lost += l - nl; progress[f.id] = nl; sched[f.id] = dueAt(f.id) + k * DECAY * DAY;
    }
    if (lost) { save(); saveSched(); decayNotice += lost; }
  }
  const dueList = () => ALL.filter(f => isDue(f.id)).sort((a, b) => dueAt(a.id) - dueAt(b.id));
  const learned = items => items.filter(f => lvl(f.id) >= 4).length;
  const started = items => items.filter(f => seen[f.id] || lvl(f.id) > 0).length;
  const pct = items => Math.round(items.reduce((s, f) => s + lvl(f.id), 0) / (items.length * MAX) * 100);

  /* ---------- утилиты ---------- */
  const $app = document.getElementById('app');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const unit = s => esc(s).replace(/\//g, '/\u2060');
  const tex = s => `<span class="tex" data-tex="${esc(s)}"></span>`;
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const cells = id => { const l = lvl(id); return `<span class="cells ${l >= 4 ? 'l5' : ''}" title="Уровень ${l} из ${MAX}">${Array.from({ length: MAX }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('')}</span>`; };
  const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? b : c; };
  const legend = f => `<ul class="legend">${f.v.map(([s, m]) => `<li>${tex(s)}<span>— ${unit(m)}</span></li>`).join('')}</ul>`;
  const ICON = {
    back: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
    close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  let mathReady = false;
  const cache = new Map();
  function typeset(root = $app) {
    root.querySelectorAll('.tex[data-tex]').forEach(el => {
      const s = el.dataset.tex;
      if (mathReady && window.MathJax && MathJax.tex2svg) {
        let node = cache.get(s);
        if (!node) {
          try { node = MathJax.tex2svg(s, { display: false }); } catch (e) { node = null; }
          if (!node && /\\(color|cssId)/.test(s)) { try { node = MathJax.tex2svg(s.replace(/\\(color|cssId)\{[^}]*\}/g, ''), { display: false }); } catch (e) { node = null; } }
          if (node) cache.set(s, node);
        }
        if (node) { el.replaceChildren(node.cloneNode(true)); el.classList.remove('raw'); return; }
      }
      el.textContent = s; el.classList.add('raw');
    });
    fitFormulas(root);
  }
  // длинная формула уменьшается, чтобы целиком влезть в карточку на узком экране
  function fitFormulas(root = $app) {
    root.querySelectorAll('.qcard .formula, .ov-formula, .solution').forEach(el => {
      el.style.fontSize = '';
      const inner = el.querySelector('.tex'); if (!inner) return;
      const cs = getComputedStyle(el);
      const avail = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const w = inner.getBoundingClientRect().width;
      if (avail > 0 && w > avail) el.style.fontSize = Math.max(12, parseFloat(cs.fontSize) * avail / w * 0.97) + 'px';
    });
  }
  let fitT; window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(() => fitFormulas(document), 120); });

  let keyHandler = null;
  document.addEventListener('keydown', e => {
    if (ov) { if (e.key === 'Escape') closeExpl(); return; }
    if (keyHandler && !e.metaKey && !e.ctrlKey && !e.altKey) keyHandler(e);
  });

  function paint(html, onKey = null) {
    $app.innerHTML = html; keyHandler = onKey; typeset();
    $app.querySelectorAll('details.idx').forEach(d => d.addEventListener('toggle', () => { idxOpen = d.open; }));
    window.scrollTo(0, 0);
  }

  /* ---------- главный экран ---------- */
  const dueText = f => {
    const l = lvl(f.id);
    if (!l && !seen[f.id]) return 'Ещё не встречалась в тренировке';
    if (l < 2) return 'Следующую клетку можно получить сразу, в тренировке';
    if (isDue(f.id)) return 'Пора повторить';
    return `Следующая клетка — ${whenLabel(dueAt(f.id))}, при повторении`;
  };
  function reviewCard() {
    const due = dueList();
    const future = ALL.filter(f => lvl(f.id) >= 1 && !isDue(f.id)).map(f => dueAt(f.id)).sort((a, b) => a - b);
    let body;
    if (due.length) body = `
        <div><span class="eyebrow">Повторение</span>
          <div class="rv-big num">${due.length} <small>${plural(due.length, 'формула ждёт', 'формулы ждут', 'формул ждут')} повторения</small></div></div>
        <button class="btn btn-primary" data-review>Повторить</button>`;
    else if (future.length) {
      const next = future[0], n = future.filter(t => whenLabel(t) === whenLabel(next)).length;
      body = `<div><span class="eyebrow">Повторение</span>
          <p class="rv-text">На сегодня всё повторено. Следующее повторение ${whenLabel(next)}: ${n} ${plural(n, 'формула', 'формулы', 'формул')}.</p></div>`;
    } else body = `<div><span class="eyebrow">Повторение</span>
          <p class="rv-text">Здесь появятся формулы, которые пора повторить. Начни с тренировки.</p></div>`;
    const warn = due.length ? `<p class="rv-warn">Если не повторить формулу 3 дня, она теряет клетку.</p>` : '';
    const lostMsg = decayNotice ? `<p class="rv-lost">Пока тебя не было, формулы потеряли ${decayNotice} ${plural(decayNotice, 'клетку', 'клетки', 'клеток')}. Повтори их, чтобы вернуть.</p>` : '';
    decayNotice = 0;
    return `<section class="review ${due.length ? 'hot' : ''}">${lostMsg}${body}${warn}<button class="link rv-help" data-help>Как работает повторение</button></section>`;
  }
  function home() {
    setBack(null);
    applyDecay();
    checkAch(true);
    const total = ALL.length, done = learned(ALL);
    const weak = ALL.filter(f => lvl(f.id) < MAX).length;
    paint(`
      <header class="brand">
        <span class="eyebrow">Физика</span>
        <h1>Формулы <i>для ЕГЭ</i></h1>
      </header>
      ${streakLine()}
      <button class="ach-btn" data-ach><span aria-hidden="true">🏆</span><span>Достижения</span><b class="num">${ACHS.filter(a => ach.got[a.id]).length} из ${ACHS.length}</b></button>
      <section class="summary">
        <div>
          <span class="eyebrow">Весь курс</span>
          <div class="big num">${pct(ALL)}%<small> освоено</small></div>
          <div class="meter"><span style="width:${pct(ALL)}%"></span></div>
          <div class="counts num">Начато ${started(ALL)} из ${total} · выучено ${done}</div>
          ${lenChips(ALL)}
        </div>
        <button class="btn ${dueList().length ? 'btn-ghost' : 'btn-primary'}" data-go="mix-all" ${weak ? '' : 'disabled'}>Тренировка</button>
      </section>
      ${reviewCard()}
      <section class="sec">
        <div class="section-head"><h2>Разделы</h2></div>
        <div class="topics">
          ${SECTIONS.map(sec => `
            <button class="topic" data-section="${sec.code}">
              <span class="code">${sec.code}</span>
              <span>
                <span class="name">${esc(sec.title)}</span><br>
                <span class="meta num">начато ${started(sec.items)} из ${sec.items.length} · выучено ${learned(sec.items)}</span>
                <span class="meter"><span style="width:${pct(sec.items)}%"></span></span>
              </span>
              <span class="pct num">${pct(sec.items)}%</span>
            </button>`).join('')}
          ${UPCOMING.filter(([c]) => !SECTIONS.some(x => x.code === c)).map(([c, n]) => `<div class="topic locked"><span class="code">${c}</span><span class="name">${n}</span><span class="soon">скоро</span></div>`).join('')}
        </div>
      </section>
      <footer class="foot">
        <button class="link" data-welcome>Как пользоваться</button><button class="link" data-reset>Сбросить прогресс</button>
      </footer>
    `);
    $app.querySelectorAll('[data-section]').forEach(b => b.onclick = () => section(b.dataset.section));
    const wl = $app.querySelector('[data-welcome]'); if (wl) wl.onclick = () => openWelcome();
    const ab = $app.querySelector('[data-ach]'); if (ab) ab.onclick = openAch;
    const rv = $app.querySelector('[data-review]'); if (rv) rv.onclick = () => start({ pool: dueList(), mode: 'mix', label: 'Повторение', back: home, count: 20, review: true });
    wireLen(home);
    $app.querySelectorAll('[data-help]').forEach(b => b.onclick = openHelp);
    $app.querySelector('[data-go="mix-all"]').onclick = () => start({ pool: ALL, mode: 'mix', label: 'Тренировка', back: home, count: lenOf(ALL) });
    $app.querySelector('[data-reset]').onclick = openResetConfirm;
  }

  /* ---------- экран темы ---------- */
  const MODES = {
    pick:  ['Найди формулу', 'По названию выбери верную формулу из четырёх'],
    name:  ['Узнай формулу', 'По формуле выбери, как она называется'],
    gap:   ['Заполни пропуск', 'В формуле не хватает части – выбери, что стоит на месте вопроса'],
    build: ['Собери формулу', 'Расставь кусочки формулы по пустым клеткам'],
    write: ['Напиши формулу', 'Набери формулу целиком на клавиатуре, без подсказок'],
    expr:  ['Вырази величину', 'Выведи из формулы нужную величину, как в начале решения задачи'],
    graph: ['Узнай график', 'По графику найди формулу или по формуле выбери график, как в задачах ЕГЭ'],
    calc:  ['Посчитай', 'Реши короткую задачу с числами. Не влияет на клетки и серию'],
    mix:   ['Тренировка', 'Всё вперемешку, слабые чаще']
  };
  function section(code) {
    const sec = SECTIONS.find(x => x.code === code);
    paint(`
      <div class="bar"><button class="icon-btn" data-back aria-label="Назад">${ICON.back}</button></div>
      <header class="topic-head">
        <span class="eyebrow">Раздел ${sec.code} · ${sec.items.length} ${plural(sec.items.length, 'формула', 'формулы', 'формул')}</span>
        <h1>${esc(sec.title)}</h1>
      </header>
      <div class="sec-card">
        <div class="sec-stats">
          <div class="sec-top"><b class="num">${pct(sec.items)}%</b><span class="muted">освоено</span></div>
          <div class="meter"><span style="width:${pct(sec.items)}%"></span></div>
          <div class="counts num">Начато ${started(sec.items)} из ${sec.items.length} · выучено ${learned(sec.items)}</div>
          ${lenChips(sec.items)}
        </div>
        <button class="btn btn-primary" data-sec>Тренировка</button>
      </div>
      <section class="sec">
        <div class="section-head"><h2>Темы</h2></div>
        <div class="topics">
          ${sec.topics.map(t => `
            <button class="topic" data-topic="${t.id}">
              <span class="code">${t.code}</span>
              <span>
                <span class="name">${esc(t.title)}</span><br>
                <span class="meta num">начато ${started(t.items)} из ${t.items.length} · выучено ${learned(t.items)}</span>
                <span class="meter"><span style="width:${pct(t.items)}%"></span></span>
              </span>
              <span class="pct num">${pct(t.items)}%</span>
            </button>`).join('')}
        </div>
      </section>
    `, e => { if (e.key === 'Escape') home(); });
    $app.querySelector('[data-back]').onclick = home;
    setBack(home);
    $app.querySelector('[data-sec]').onclick = () => start({ pool: sec.items, mode: 'mix', label: sec.title, back: () => section(code), count: lenOf(sec.items) });
    wireLen(() => section(code));
    $app.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => topic(b.dataset.topic));
  }
  let modesOpen = false;                             // раскрыт ли список режимов (на время сессии)
  function topic(id) {
    const t = TOPICS.find(x => x.id === id);
    const modeList = ['pick', 'name', 'gap', 'build', 'write', 'expr', 'graph', 'calc'].filter(m => m === 'expr' ? t.items.some(f => f.x) : m === 'graph' ? t.items.some(hasGraph) : m === 'calc' ? t.items.some(canCalc) : true);
    const back = () => topic(id);
    paint(`
      <div class="bar"><button class="icon-btn" data-back aria-label="Назад">${ICON.back}</button></div>
      <header class="topic-head">
        <span class="eyebrow">Раздел ${t.code} · ${t.items.length} ${plural(t.items.length, 'формула', 'формулы', 'формул')}</span>
        <h1>${esc(t.title)}</h1>
        <div class="meter"><span style="width:${pct(t.items)}%"></span></div>
        <span class="muted num" style="font-size:14px">Освоено ${pct(t.items)}% · начато ${started(t.items)} из ${t.items.length} · выучено ${learned(t.items)}</span>
      </header>
      <section class="modes">
        <button class="mode primary" data-mode="mix"><b>${MODES.mix[0]}</b></button>
        <details class="more-modes" ${modesOpen ? 'open' : ''}>
          <summary><span>Режимы</span><small>${modeList.length} ${plural(modeList.length, 'режим', 'режима', 'режимов')}</small></summary>
          <div class="modes-list">
            ${modeList.map(m => `<button class="mode" data-mode="${m}"><b>${MODES[m][0]}</b><span>${MODES[m][1]}</span></button>`).join('')}
          </div>
        </details>
      </section>
      <section style="display:flex;flex-direction:column;gap:10px">
        <div class="section-head"><h2 class="with-help">Шпаргалка <button class="help" data-help aria-label="Что значат клетки">?</button></h2><span class="eyebrow">нажми, чтобы раскрыть</span></div>
        <div class="sheet">
          ${t.items.map(f => `
            <details>
              <summary><span class="fname">${esc(f.n)}</span>${cells(f.id)}<span class="fbody">${tex(f.f)}</span></summary>
              <div class="due-note">${dueText(f)}</div>
              ${legend(f)}
              ${EXPL[f.id] ? `<div class="why"><button class="link" data-why="${f.id}">Откуда берётся формула</button></div>` : ''}
            </details>`).join('')}
        </div>
      </section>
    `, e => { if (e.key === 'Escape') section(t.code.split('.')[0]); });
    $app.querySelector('[data-back]').onclick = () => section(t.code.split('.')[0]);
    setBack(() => section(t.code.split('.')[0]));
    $app.querySelectorAll('[data-help]').forEach(b => b.onclick = openHelp);
    $app.querySelectorAll('[data-why]').forEach(b => b.onclick = () => openExpl(byId[b.dataset.why]));
    const mm = $app.querySelector('.more-modes'); if (mm) mm.addEventListener('toggle', () => { modesOpen = mm.open; });
    $app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { const m = b.dataset.mode, pool = m === 'expr' ? t.items.filter(f => f.x) : m === 'graph' ? t.items.filter(hasGraph) : m === 'calc' ? t.items.filter(canCalc) : t.items; start({ pool, mode: m, label: t.title, back, count: pool.length }); });
  }

  /* ---------- сессия ---------- */
  let S = null;
  // длина тренировки для раздела и всего курса: выбирает ученик, запоминаем
  const LENS = [10, 20, 30, 0];                     // 0 – все формулы
  let lenPref = 20;
  try { const raw = localStorage.getItem('formuly.len.v1'); if (raw !== null && LENS.includes(+raw)) lenPref = +raw; } catch (e) {}
  const lenOf = pool => lenPref ? Math.min(lenPref, pool.length) : pool.length;
  const lenChips = pool => `<div class="len" role="group" aria-label="Сколько заданий"><span>Заданий:</span>${LENS.filter(n => !n || n < pool.length).map(n => `<button class="${n === lenPref || (!n && lenPref >= pool.length) ? 'on' : ''}" data-len="${n}">${n || 'все ' + pool.length}</button>`).join('')}</div>`;
  const wireLen = redraw => $app.querySelectorAll('[data-len]').forEach(b => b.onclick = () => { lenPref = +b.dataset.len; try { localStorage.setItem('formuly.len.v1', String(lenPref)); } catch (e) {} redraw(); });
  function start({ pool, mode, label, back, count, review }) {
    const rank = f => { const l = lvl(f.id); if (l >= 1 && isDue(f.id)) return 0; if (l >= 1 && l < 2) return 1; if (!seen[f.id] && l === 0) return 1.5; if (l === 0) return 1; return 2.5 + l / 2; };
    const ordered = pool.map(f => ({ f, k: rank(f) + Math.random() * 1.2 })).sort((a, b) => a.k - b.k).map(x => x.f);
    const n = Math.min(count || pool.length, pool.length);
    let items = shuffle(ordered.slice(0, n)), graphs = null;
    // «Узнай график»: в раунд идут все графики темы, а не по одному на формулу
    if (mode === 'graph') { const pairs = shuffle(pool.flatMap(f => GRAPH_BY[f.id].map(g => [f, g]))); items = pairs.map(x => x[0]); graphs = pairs.map(x => x[1]); }
    const modes = items.map(f => { if (mode !== 'mix') return mode; const m = ['pick', 'name', 'gap', 'build', 'write', ...(f.x ? ['expr'] : []), ...(hasGraph(f) ? ['graph'] : [])]; return m[Math.random() * m.length | 0]; });
    S = { pool, mode, label, back, count, review, items, modes, graphs, i: 0, results: [] };
    streakUp = false; achNew = [];
    question();
  }

  function top() {
    return `<div class="bar">
      <button class="icon-btn" data-close aria-label="Закончить">${ICON.close}</button>
      <div class="progress"><span style="width:${S.i / S.items.length * 100}%"></span></div>
      <span class="count num">${S.i + 1} / ${S.items.length}</span>
    </div>`;
  }
  function wireTop() { const fn = () => S.results.length ? result() : S.back(); $app.querySelector('[data-close]').onclick = fn; setBack(fn); }

  function record(f, ok) {
    haptic(ok ? 'ok' : 'bad');
    // «Посчитай» – тренировка без клеток: прогресс, сроки повторений и серию дней не трогаем
    const calc = S.modes[S.i] === 'calc';
    const info = calc ? { counted: true, calc: true } : bump(f.id, ok);
    if (!calc) streakTick();
    S.results.push({ f, ok, ...info });
    if (S.mode !== 'mix') ach.solo[S.modes[S.i]] = 1;   // «Попробовал всё»: только режим, запущенный отдельно
    // серия без ошибок: считается только в «Тренировке» (всё вперемешку); отдельные режимы и повторение её не меняют
    if (S.mode === 'mix' && !S.review) { ach.row = ok ? ach.row + 1 : 0; ach.best = Math.max(ach.best, ach.row); }
    if (calc) { if (ok) ach.calc++; } else ach.n++;
    saveAch(); checkAch();
  }
  const earlyNote = () => { const r = S.results[S.results.length - 1]; return r && r.ok && !r.counted && !r.calc ? `<span class="note">Следующая клетка — ${whenLabel(r.due)}, при повторении</span>` : ''; };
  function next() { S.i++; S.i < S.items.length ? question() : result(); }

  function question() {
    const f = S.items[S.i], mode = S.modes[S.i];
    if (mode === 'pick') return qPick(f);
    if (mode === 'gap') return qGap(f);
    if (mode === 'build') return qBuild(f);
    if (mode === 'write') return qWrite(f);
    if (mode === 'expr') return qExpr(f);
    if (mode === 'calc') return qCalc(f);
    if (mode === 'graph') return qGraph(f);
    return qName(f);
  }

  /* ---------- «Узнай график»: график ↔ формула ---------- */
  // s – форма графика: lin0 – прямая из нуля, lin – прямая со сдвигом, dec – убывающая прямая, const – горизонталь,
  // vert – вертикаль, par – парабола, sqrt – корень, hyp – гипербола, cos/sin – колебания (ось времени посередине)
  const TX = '\\text{const}';
  const GRAPHS = [
    { f: 'kin-1', x: 't', y: 'x', s: 'lin', tex: 'x = x_0 + v_x t', w: [['x = v_x t', 'lin0'], ['x = \\frac{a t^2}{2}', 'par'], ['x = x_0', 'const']] },
    { f: 'kin-3', x: 't', y: 'v_x', s: 'lin', tex: 'v_x = v_{0x} + a_x t', w: [['v_x = a_x t', 'lin0'], ['v_x = v_{0x}', 'const'], ['v_x = \\frac{a_x t^2}{2}', 'par']] },
    { f: 'kin-4', x: 't', y: 'x', s: 'par', c: 'x_0 = 0,\\ v_{0x} = 0', tex: 'x = \\frac{a_x t^2}{2}', w: [['x = a_x t', 'lin0'], ['x = \\sqrt{a_x t}', 'sqrt'], ['x = \\frac{a_x}{t}', 'hyp']] },

  // изопроцессы в трёх парах осей: какой процесс изображён / какой график у процесса

  for (const [k, [f, name]] of Object.entries(PROC)) for (const [x, y, sh] of PROC_AX) GRAPHS.push({ f, x, y, s: sh[k], proc: k, name, alt: Object.keys(PROC).filter(q => q !== k).map(q => [PROC[q][1], sh[q]]) });

    if (s === 'vert') return [[0.5, 0.12], [0.5, 0.88]];

  /* ---------- что значат индексы: расшифровка обозначений с индексами в задании ---------- */

  // обозначения, которые встречаются только в неверных вариантах

    'E_{\\text{п}1}': ['E_{\\text{п}1}, E_{\\text{п}2}', 'начальная и конечная потенциальная энергия'],
    'E_{\\text{п}2}': ['E_{\\text{п}1}, E_{\\text{п}2}', 'начальная и конечная потенциальная энергия'],
    't_1': ['t_1, t_2', 'температура газа по шкале Цельсия в начальном и конечном состояниях'],
    't_2': ['t_1, t_2', 'температура газа по шкале Цельсия в начальном и конечном состояниях'],
    '\\rho_{\\text{в}}': ['\\rho_{\\text{в}}', 'плотность воздуха']
  };
  const defsOf = v => {
    const out = {};
    for (const [sym, desc] of v || []) {
      if (!desc) continue;
      const k = desc.lastIndexOf(', '), unit = k >= 0 ? desc.slice(k + 2).trim() : '', mean = k >= 0 && UNIT_OK(unit) ? desc.slice(0, k) : desc;
      const shown = stripVec(sym);
      for (const one of sym.split(', ')) { const key = normSym(one); if (key.includes('_') && !out[key]) out[key] = { syms: shown, mean }; }
    }
    return out;
  };
  let GDEFS = null;
  const globalDefs = () => {
    if (GDEFS) return GDEFS;
    GDEFS = {};
    for (const f of ALL) for (const [k, d] of Object.entries(defsOf(f.v))) if (!GDEFS[k]) GDEFS[k] = d;
    for (const [k, [syms, mean]] of Object.entries(SYM_EXTRA)) if (!GDEFS[k]) GDEFS[k] = { syms, mean };
    return GDEFS;
  };
  const TDEFS = {};
  const topicDefs = t => TDEFS[t.id] ||= t.items.reduce((m, x) => { for (const [k, d] of Object.entries(defsOf(x.v))) if (!m[k]) m[k] = d; return m; }, {});
  function idxHint(f, list) {
    const own = defsOf(f.v), top = topicDefs(f.topic), glob = globalDefs(), keys = [], groups = [];
    for (const t of list) for (const k of symsIn(t)) if (!keys.includes(k)) keys.push(k);
    for (const k of keys) {
      const d = own[k] || top[k] || glob[k]; if (!d) continue;
      if (!groups.some(x => x.syms === d.syms && x.mean === d.mean)) groups.push(d);
    }
    if (!groups.length) return '';
    return `<details class="idx" ${idxOpen ? 'open' : ''}><summary>Что значат индексы</summary><ul>${groups.map(d => `<li>${tex(d.syms)}<span>– ${esc(d.mean)}</span></li>`).join('')}</ul></details>`;
  }

  function choice(f, { eyebrow, ask, askTex, askHtml, sub, options, correct, isTex, row, note, solution, idx, optHtml, grid }) {
    let picked = null;
    const render = () => {
      const done = picked !== null;
      paint(`${top()}
        <article class="qcard" style="min-height:0">
          <span class="eyebrow">${eyebrow}</span>
          ${ask ? `<div class="ask">${esc(ask)}</div>` : ''}
          ${askHtml || ''}
          ${askTex ? `<div class="formula">${tex(askTex)}</div>` : ''}
          ${sub ? `<div class="sub">${sub}</div>` : ''}
          ${idx || ''}
        </article>
        <div class="options ${row ? 'row' : ''} ${grid ? 'grid' : ''}" role="group">
          ${options.map((o, i) => {
            let cls = '';
            if (done) cls = o === correct ? 'right' : (o === picked ? 'wrong' : 'dim');
            return `<button class="opt ${optHtml ? 'gopt' : isTex ? '' : 'text'} ${cls}" data-i="${i}" ${done ? 'disabled' : ''}><span class="k">${i + 1}</span>${optHtml ? optHtml(o) : isTex ? tex(o) : `<span>${unit(o)}</span>`}</button>`;
          }).join('')}
        </div>
        ${done ? `
          <div class="verdict-line"><span class="verdict ${picked === correct ? 'ok' : 'bad'}">${picked === correct ? 'Верно' : 'Ошибка — верный вариант подсвечен зелёным'}</span>${earlyNote()}</div>
          ${solution ? `<div class="solution">${solution}</div>` : ''}
          ${afterActions(f)}` : ''}
      `, e => {
        if (!done && /^[1-4]$/.test(e.key)) pick(options[+e.key - 1]);
        else if (done && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); next(); }
        else if (e.key === 'Escape') S.results.length ? result() : S.back();
      });
      wireTop();
      $app.querySelectorAll('[data-i]').forEach(b => b.onclick = () => pick(options[+b.dataset.i]));
      const n = $app.querySelector('[data-next]'); if (n) { n.onclick = next; n.focus({ preventScroll: true }); }
      const xb = $app.querySelector('[data-expl]'); if (xb) xb.onclick = () => openExpl(f);
    };
    const pick = o => { if (picked !== null || o === undefined) return; picked = o; record(f, o === correct); render(); };
    render();
  }

  function qPick(f) {
    const options = shuffle([f.f, ...f.w.slice(0, 3)]);
    choice(f, { eyebrow: `${esc(f.topic.title)} · найди верную формулу`, ask: f.n, options, correct: f.f, isTex: true, idx: idxHint(f, options) });
  }
  function qName(f) {
    const same = f.topic.items.filter(x => x !== f);
    const others = (same.length >= 3 ? shuffle(same) : shuffle(ALL.filter(x => x !== f))).slice(0, 3).map(x => x.n);
    choice(f, { eyebrow: `${esc(f.topic.title)} · что это за формула?`, askTex: f.f, options: shuffle([f.n, ...others]), correct: f.n, isTex: false });
  }

  /* шаблон с клетками: fill[k] — содержимое клетки или null */
  const OKC = '#2FA36B', BADC = '#E5534B';
  function tpl(f, fill, { cur = -1, marks = null, plain = false } = {}) {
    let k = 0;
    return f.b.tpl.replace(/⟦[^⟧]+⟧/g, () => {
      const i = k++, c = fill[i];
      // «Заполни пропуск»: без рамок, на месте пропуска просто вопрос
      if (plain) return c == null ? '\\,{\\color{#4C6FFF}{?}}\\,' : `{${c}}`;
      if (c == null) return i === cur ? '\\boxed{\\,?\\,}' : '\\boxed{\\phantom{00}}';
      const col = marks ? (marks[i] ? OKC : BADC) : null;
      return col ? `\\boxed{\\color{${col}}{${c}}}` : `\\boxed{${c}}`;
    });
  }
  function qGap(f) {
    const sl = f.b.slots, k = Math.random() * sl.length | 0, correct = sl[k].c;
    const fill = sl.map((x, i) => i === k ? null : x.c);
    const pool = [...new Set([...f.b.extra, ...sl.map(x => x.c)])].filter(x => x !== correct);
    const options = shuffle([correct, ...shuffle(pool).slice(0, 3)]);
    choice(f, { eyebrow: `${esc(f.topic.title)} · заполни пропуск`, ask: f.n, askTex: tpl(f, fill, { cur: k, plain: true }), options, correct, isTex: true, idx: idxHint(f, [f.b.tpl, ...options]) });
  }
  function checkBuild(f, fill) {
    const sl = f.b.slots, left = {};
    sl.forEach(x => { if (x.g) (left[x.g] = left[x.g] || []).push(x.c); });
    return sl.map((x, i) => {
      if (!x.g) return fill[i] === x.c;
      const j = left[x.g].indexOf(fill[i]);
      if (j < 0) return false;
      left[x.g].splice(j, 1); return true;
    });
  }
  function qBuild(f) {
    const sl = f.b.slots;
    const tiles = shuffle([...sl.map(x => x.c), ...f.b.extra]).map(t => ({ t, used: false }));
    let placed = [], marks = null;
    const idx = idxHint(f, [f.b.tpl, ...tiles.map(x => x.t)]);
    const render = () => {
      const fill = sl.map((_, i) => placed[i] != null ? tiles[placed[i]].t : null);
      const full = placed.length === sl.length, done = marks !== null, ok = done && marks.every(Boolean);
      paint(`${top()}

          <div class="tiles">${tiles.map((x, i) => `<button class="tile" data-t="${i}" ${x.used ? 'disabled' : ''}>${tex(x.t)}</button>`).join('')}</div>

        ${done ? `

      `, e => {

      });
      wireTop();
      $app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => put(+b.dataset.t));

          `<polyline data-a="graph" points="" class="wave"/>` +
          `<line data-a="link" x1="73" y1="130" x2="110" y2="130" class="ln dash"/>` + `<circle data-a="pt" cx="110" cy="85" r="5" class="dot"/>`),

            const yc = y(t), top = 12, bot = yc - 15, n = 10, step = (bot - top - 12) / n;
            blk.setAttribute('y', r1(bot));

          `<g data-a="g"></g>`),
        anim: el => {

          return r => {
            const f = Math.min(1, Math.max(0, (r - 0.3) / 3.3)), u = 1 + 2 * (1 - (1 - f) ** 2), s = st(u), s0 = st(1);

            out += `<polyline points="${pts(tr)}" class="wave"/>` + dot(r1(tr[0][0]), r1(tr[0][1]), 4) + T(r1(tr[0][0] - 6), r1(tr[0][1] - 8), '1', 'm', 'end') + dot(r1(e[0]), r1(e[1]), 5) +
              (f >= 1 ? T(r1(e[0] + 6), r1(e[1] - 8), '2', 'm', 'start') : '') + (kind === 'W' && f >= 1 ? T(r1((X(1) + X(u)) / 2), 140, 'A = pΔV', 'm acct') : '');

      else if (line.startsWith('p: ')) cur.push({ p: line.slice(3) });
      else if (line.startsWith('fig: ')) { const [fg, ...cp] = line.slice(5).split(' | '); cur.push({ fig: fg.trim(), cap: cp.join(' | ').trim() || null }); }

  // анимированные рисунки: при открытии пояснения проигрываются один раз, кнопка «Ещё раз» запускает заново
  function startAnims(root) {
    root.querySelectorAll('figure[data-anim]').forEach(fig => {
      const el = fig.querySelector('svg'), btn = fig.querySelector('[data-anim-toggle]');
      const def = FIG[fig.dataset.anim], frame = def.anim(el), dur = def.dur;
      const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      let t0 = null, running = false;
      btn.textContent = '↻ Ещё раз';
      const loop = now => {
        if (!el.isConnected) { running = false; return; }
        if (t0 === null) t0 = now;
        const t = Math.min(dur, (now - t0) / 1000);
        frame(t);
        if (t < dur) requestAnimationFrame(loop); else running = false;
      };
      const play = () => { if (still) { frame(dur); return; } t0 = null; if (!running) { running = true; requestAnimationFrame(loop); } };
      frame(still ? dur : 0);
      btn.addEventListener('click', play);
      // запускается, когда рисунок прокрутили в зону видимости
      if (window.IntersectionObserver) {
        const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); play(); } }, { threshold: 0.6 });
        io.observe(fig);
      } else play();
    });
  }

    const sub = n => n.k === 'atom' ? { k: 'num', v: t.vals[n.tex] } : Object.fromEntries(Object.entries(n).map(([k, v]) => [k, k === 'op' && v === 'imp' ? '*' : v && typeof v === 'object' ? sub(v) : v]));

    const correct = withUnit(t.ans, tu);
    choice(f, {
      eyebrow: `${esc(f.topic.title)} · посчитай <span class="nocells">без клеток и серии</span>`,
      askHtml: `<div class="ask">Найди ${tex(t.target)}${infoOf(f, t.target).mean ? ` <span class="mean">– ${esc(infoOf(f, t.target).mean)}</span>` : ''}</div><div class="given-vals"><span class="lbl">Дано:</span> ${given}</div>`,
      options: shuffle([correct, ...t.wrong.map(v => withUnit(v, tu))]), correct, isTex: true,
      solution: tex(`${t.target} = ${toTex(clean(t.tree))} = ${toTex(sub(t.tree))} = ${correct}`)
    });
  }
  function writeTask(f, { kind, ask, lhs, alts, answer, mine }) {
    const answers = alts.map(t => parseExpr(t).tree);
    const low = new Set(mine.map(a => a.toLowerCase()));
    // не подмешиваем ту же букву в другом регистре (m и M), чтобы не путать, какую брать
    const pool = [...new Set(f.topic.items.filter(x => x !== f).flatMap(atomsOf))].filter(a => !low.has(a.toLowerCase()));
    const atoms = shuffle([...mine, ...shuffle(pool).slice(0, 3)]);
    const fns = [...new Set(alts[0].filter(t => t.t === 'fn' && t.name !== 'sqrt').map(t => t.name))];
    const nums = [...new Set([1, 2, ...alts[0].filter(t => t.t === 'num').map(t => t.v)])].sort((a, b) => a - b);
    if (fns.includes('cos')) fns.push('sin');
    const KEYS = [
      ...atoms.map(a => ({ tok: { t: 'atom', tex: a }, label: tex(a), cls: 'var' })),
      { tok: { t: 'op', v: '+' }, label: '+' }, { tok: { t: 'op', v: '-' }, label: '−' }, { tok: { t: 'op', v: '*' }, label: tex('\\cdot') },
      { act: 'frac', label: tex('\\frac{\\square}{\\square}') }, { tok: { t: 'sq' }, label: tex('\\square^2') },
      { tok: { t: 'lp' }, label: '(' }, { tok: { t: 'rp' }, label: ')', id: 'rp' }, { act: 'sqrt', label: tex('\\sqrt{\\square}') },
      ...nums.map(v => ({ tok: { t: 'num', v }, label: String(v) })), { tok: { t: 'pi' }, label: tex('\\pi') },
      ...fns.map(n => ({ act: 'fn:' + n, label: tex(`\\${n}`) }))
    ];
    const ed = makeEditor();
    const idx = idxHint(f, [lhs, ...(kind === 'вырази величину' ? [f.xg || f.f] : []), ...atoms]);
    let verdict = null;
    const render = () => {
      const done = verdict !== null, ok = verdict === true;
      const flat = flattenList(ed.root), p = parseExpr(flat);
      const slotMap = {};
      const body = done ? renderEditor(ed, null, false) : renderEditor(ed, slotMap);
      const hint = done ? '' : ed.hint();
      paint(`${top()}
        <article class="qcard" style="min-height:0">
          <span class="eyebrow">${esc(f.topic.title)} · ${kind}</span>
          ${ask}
          <div class="formula write-line">${tex(`${lhs} = ${body}`)}</div>
          ${hint ? `<p class="hint">${hint}</p>` : ''}
          ${done ? '' : idx}
        </article>
        ${done ? `
          <div class="verdict-line"><span class="verdict ${ok ? 'ok' : 'bad'}">${ok ? 'Верно' : 'Ошибка. Правильно так:'}</span>${ok ? earlyNote() : `<span class="tex-inline">${answer}</span>`}</div>
          ${afterActions(f)}` : `
          <div class="kb">
            ${KEYS.map((k, i) => `<button class="key ${k.cls || ''}" data-k="${i}" data-key="${esc(k.tok ? (k.tok.tex || k.tok.v || k.tok.t) : k.act)}" ${k.id === 'rp' && !ed.openParens() ? 'disabled' : ''}>${k.label}</button>`).join('')}
            <button class="key nav" data-prevslot aria-label="Назад по формуле" ${ed.canPrev() ? '' : 'disabled'}>←</button>
            <button class="key nav" data-nextslot aria-label="Дальше по формуле" ${ed.stack.length ? '' : 'disabled'}>→</button>
            <button class="key del" data-del aria-label="Стереть">⌫</button>
          </div>
          <div class="actions">
            <button class="btn btn-ghost" data-giveup>Не помню</button>
            <button class="btn btn-primary" data-check ${!ed.isEmpty() && !p.hole ? '' : 'disabled'}>Проверить</button>
          </div>`}
      `, e => {
        if (done) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } }
        else if (e.key === 'Backspace') { e.preventDefault(); ed.back(); render(); }
        else if (e.key === 'ArrowRight' || e.key === 'Tab') { e.preventDefault(); ed.next(); render(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); ed.prev(); render(); }
        else if (e.key === 'Enter') check();
        if (e.key === 'Escape') S.results.length ? result() : S.back();
      });
      wireTop();
      $app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
        const k = KEYS[+b.dataset.k];
        if (k.act === 'frac') ed.frac(); else if (k.act === 'sqrt') ed.wrap('sqrt'); else if (k.act) ed.wrap(k.act.slice(3)); else ed.push(k.tok);
        render();
      });
      if (!done) {
        // нажатие на числитель, знаменатель или подкоренное выражение переносит туда курсор
        for (const [id, path] of Object.entries(slotMap)) {
          const el = document.getElementById(id);
          if (el) { el.style.cursor = 'pointer'; el.addEventListener('click', ev => { ev.stopPropagation(); ed.setPath(path); render(); }); }
        }
      }
      const ns = $app.querySelector('[data-nextslot]'); if (ns) ns.onclick = () => { ed.next(); render(); };
      const ps = $app.querySelector('[data-prevslot]'); if (ps) ps.onclick = () => { ed.prev(); render(); };
      const d = $app.querySelector('[data-del]'); if (d) d.onclick = () => { ed.back(); render(); };
      const c = $app.querySelector('[data-check]'); if (c) c.onclick = check;
      const g = $app.querySelector('[data-giveup]'); if (g) g.onclick = () => finish(false);
      const n = $app.querySelector('[data-next]'); if (n) { n.onclick = next; n.focus({ preventScroll: true }); }
      const xb = $app.querySelector('[data-expl]'); if (xb) xb.onclick = () => openExpl(f);
    };
    const finish = ok => { if (verdict !== null) return; verdict = ok; record(f, ok); render(); };
    const check = () => {
      const p = parseExpr(flattenList(ed.root));
      if (ed.isEmpty() || p.hole) return;
      finish(answers.some(a => sameExpr(p.tree, a)));
    };
    render();
  }

  /* ---------- результат ---------- */
  function result() {
    const r = S.results, ok = r.filter(x => x.ok).length, miss = r.filter(x => !x.ok);
    checkAch(true);
    const note = !r.length ? '' : S.mode === 'calc' ? 'Режим «Посчитай» тренирует расчёты и не меняет клетки прогресса и серию дней.' : ok === r.length ? 'Чисто! Эти формулы будут попадаться реже.' : ok / r.length >= .7 ? 'Хорошо. Ошибки ниже — повтори их ещё раз.' : 'Нормально для начала. Ошибки будут попадаться чаще, пока не запомнишь.';
    paint(`
      <div class="bar"><span class="title">${esc(S.label)}</span></div>
      <section class="result">
        <span class="eyebrow">Результат</span>
        <div class="score num">${ok}<small> / ${r.length}</small></div>
        <p class="muted" style="margin:0; max-width:34ch">${note}</p>
        ${achNew.length ? `<div class="ach-new">${achNew.map(a => `<span>${a.icon} ${esc(a.t)}</span>`).join('')}</div>` : ''}
        ${streakUp ? `<p class="streak-up">🔥 ${streakNow()} ${daysWord(streakNow())} подряд${streakNow() > 1 ? ' — серия продолжается!' : ' — серия началась!'}</p>` : !doneToday() && r.length && S.mode !== 'calc' ? `<p class="muted" style="margin:0">Ещё ${leftToday()} ${plural(leftToday(), 'задание', 'задания', 'заданий')} сегодня — и день засчитается в серию.</p>` : ''}
        ${(() => { const d = dueList().length; if (d) return `<p class="muted" style="margin:0">На повторение ещё ${plural(d, 'ждёт', 'ждут', 'ждут')} ${d} ${plural(d, 'формула', 'формулы', 'формул')}.</p>`; const tm = ALL.filter(f => lvl(f.id) >= 1 && whenLabel(dueAt(f.id)) === 'завтра').length; return tm ? `<p class="muted" style="margin:0">Завтра на повторение: ${tm} ${plural(tm, 'формула', 'формулы', 'формул')}.</p>` : ''; })()}
      </section>
      ${miss.length ? `
        <section style="display:flex;flex-direction:column;gap:10px">
          <div class="section-head"><h2>Где ошибся</h2></div>
          <div class="missed">${miss.map(({ f }) => `<div class="row"><span class="muted" style="font-size:14px">${esc(f.n)}</span><span class="tex-wrap">${tex(f.f)}</span></div>`).join('')}</div>
        </section>` : ''}
      <div class="actions">
        <button class="btn btn-ghost" data-done>Готово</button>
        <button class="btn btn-primary" data-again>Ещё раунд</button>
      </div>
    `, e => { if (e.key === 'Enter') again(); else if (e.key === 'Escape') S.back(); });
    const again = () => start(S);
    $app.querySelector('[data-again]').onclick = again;
    $app.querySelector('[data-done]').onclick = () => S.back();
    setBack(() => S.back());
  }

  /* ---------- приветствие при первом запуске ---------- */
  let onboarded = false;
  try { onboarded = localStorage.getItem('formuly.onb.v1') === '1'; } catch (e) {}
  const WELCOME = [
    { t: 'Формулы для ЕГЭ', b: `<p>Здесь ты учишь формулы по физике, которые мы проходим на курсе. Одна тренировка — 10 вопросов и 3–5 минут.</p><p>Режимы разные: найти формулу, узнать её, собрать из кусочков или набрать самому. Если ошибся, открой «Пояснение»: там разобрано, откуда формула берётся.</p>` },
    { t: 'Клетки', b: `<p>У каждой формулы 5 клеток. Правильный ответ закрашивает клетку, ошибка стирает две.</p><ul class="help-list"><li>${'CELLS0'}<span>ещё не встречалась</span></li><li>${'CELLS2'}<span>начата</span></li><li>${'CELLS4'}<span>выучена</span></li></ul>` },
    { t: 'Заходи каждый день', b: `<p>Выученные формулы возвращаются на повторение: через день, потом через 3, 7 и 14 дней. Так они остаются в голове до экзамена.</p><p>Если формула ждёт повторения, а ты 3 дня не заходишь, она теряет клетку. Хватает 5 минут в день.</p>` }
  ];
  function openWelcome() {
    if (ov) return;
    let step = 0;
    ov = document.createElement('div');
    ov.className = 'ov';
    const cellsDemo = n => `<span class="cells ${n >= 4 ? 'l5' : ''}">${Array.from({ length: MAX }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
    const draw = () => {
      const w = WELCOME[step], last = step === WELCOME.length - 1;
      ov.innerHTML = `
        <div class="ov-card welcome" role="dialog" aria-modal="true" aria-label="${w.t}">
          <span class="eyebrow">${step + 1} из ${WELCOME.length}</span>
          <h2>${w.t}</h2>
          ${w.b.replace('CELLS0', cellsDemo(0)).replace('CELLS2', cellsDemo(2)).replace('CELLS4', cellsDemo(4))}
          <div class="dots">${WELCOME.map((_, i) => `<i class="${i === step ? 'on' : ''}"></i>`).join('')}</div>
          <button class="btn btn-primary" data-wnext>${last ? 'Начать' : 'Дальше'}</button>
        </div>`;
      ov.querySelector('[data-wnext]').onclick = () => {
        if (!last) { step++; draw(); return; }
        onboarded = true;
        try { localStorage.setItem('formuly.onb.v1', '1'); } catch (e) {}
        cloudQueue('o', 1);
        closeExpl();
      };
    };
    draw();
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
  }

  /* ---------- запуск ---------- */
  function boot() {
    cloudLoad(['p', 's', 'd', 'o', 'k', 'a'], data => {
      const has = o => o && typeof o === 'object' && Object.keys(o).length;
      if (has(data.p)) { progress = data.p; seen = has(data.s) ? data.s : seen; sched = has(data.d) ? data.d : sched; try { localStorage.setItem(KEY, JSON.stringify(progress)); localStorage.setItem(SEEN_KEY, JSON.stringify(seen)); localStorage.setItem(SCHED_KEY, JSON.stringify(sched)); } catch (e) {} }
      else if (Object.keys(progress).length) { cloudQueue('p', progress); cloudQueue('s', seen); cloudQueue('d', sched); }
      if (data.o) onboarded = true;
      if (data.k && typeof data.k === 'object' && (data.k.n || 0) >= (streak.n || 0) && data.k.d) { streak = { ...streak, ...data.k }; try { localStorage.setItem(STREAK_KEY, JSON.stringify(streak)); } catch (e) {} }
      else if (streak.d) cloudQueue('k', streak);
      if (data.a && typeof data.a === 'object') {
        const c = data.a;
        ach = { got: { ...(c.got || {}), ...ach.got }, n: Math.max(ach.n, c.n || 0), calc: Math.max(ach.calc, c.calc || 0), modes: { ...(c.modes || {}), ...ach.modes }, expl: { ...(c.expl || {}), ...ach.expl }, solo: { ...(c.solo || {}), ...ach.solo }, row: ach.row || 0, best: Math.max(ach.best || 0, c.best || 0) };
        try { localStorage.setItem(ACH_KEY, JSON.stringify(ach)); } catch (e) {}
      }
      if (Object.keys(ach.got).length || ach.n) cloudQueue('a', ach);
      home();
      syncTheme();
      if (inTg) { try { tg.onEvent('themeChanged', () => { syncTheme(); }); } catch (e) {} }
      if (!onboarded) openWelcome();
    });
  }
  boot();
  const fallback = setTimeout(() => { if (!mathReady) typeset(); }, 6000);
  window.__onMath = () => { try { document.head.appendChild(MathJax.svgStylesheet()); } catch (e) {} mathReady = true; clearTimeout(fallback); cache.clear(); typeset(); };
  if (window.__mjReady) window.__onMath();
  return {};
})();
</script>

</body>
</html>
